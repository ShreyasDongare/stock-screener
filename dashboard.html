<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Scanner • Daily Market Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--panel:#fff;--ink:#16212B;--mute:#68788A;--line:#DCE2E8;--hover:#F2F6FA;--up:#17794F;--dn:#B83232;--acc:#2A5A8E;--accbg:#E2ECF6;--warn:#B16A00;--hdr:#15212C;--hdrink:#fff;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1419;--panel:#171E26;--ink:#E5EAF0;--mute:#8797A8;--line:#27313C;--hover:#1D2630;--up:#3FBE8C;--dn:#E56C6C;--acc:#80B2E6;--accbg:#223347;--warn:#E2A446;--hdr:#0B0F13}}
:root[data-theme="dark"]{--bg:#0F1419;--panel:#171E26;--ink:#E5EAF0;--mute:#8797A8;--line:#27313C;--hover:#1D2630;--up:#3FBE8C;--dn:#E56C6C;--acc:#80B2E6;--accbg:#223347;--warn:#E2A446;--hdr:#0B0F13}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% -10%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 34%),var(--bg);color:var(--ink);font:14px/1.45 var(--sans);min-height:100vh;animation:pageIn .45s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes floatIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.top{background:linear-gradient(135deg,var(--hdr),color-mix(in srgb,var(--hdr) 78%,var(--acc)));color:var(--hdrink);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.in{max-width:1240px;margin:0 auto;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#fff));font:600 18px var(--mono);box-shadow:0 5px 16px rgba(0,0,0,.18)}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:.2px}
.sub{color:#B5C2D0;font-size:12.5px;margin-top:3px;font-family:var(--mono)}
.status{display:flex;align-items:center;gap:7px;color:#C9D5E1;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.7px}
.status i{width:7px;height:7px;border-radius:50%;background:#45C98D;box-shadow:0 0 0 4px rgba(69,201,141,.12);animation:pulse 1.8s ease-in-out infinite}
.ic{background:rgba(255,255,255,.05);border:1px solid #3A4856;color:var(--hdrink);border-radius:9px;width:36px;height:36px;font-size:16px;cursor:pointer;transition:.2s ease}.ic:hover{background:rgba(255,255,255,.12);transform:rotate(12deg)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
.stale{display:none;background:var(--accbg);border-left:4px solid var(--warn);padding:9px 12px;border-radius:4px;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tab{background:color-mix(in srgb,var(--panel) 96%,var(--acc));border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease;animation:floatIn .45s ease both}
.tab:nth-child(2){animation-delay:.06s}.tab:nth-child(3){animation-delay:.12s}
.tab:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.07);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.tab b{display:block;font:500 28px/1.1 var(--mono)}.tab span{color:var(--mute);font-size:12.5px}
.tab[aria-selected="true"]{border-color:var(--acc);background:var(--accbg);box-shadow:0 7px 20px color-mix(in srgb,var(--acc) 12%,transparent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--acc);border-radius:3px 3px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,30,45,.06);overflow:hidden;animation:floatIn .5s ease .1s both}
.tools{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,var(--bg))}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,select,input,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 11px;font:inherit}
.chip{border-radius:999px;cursor:pointer;transition:.18s ease}.chip:hover{transform:translateY(-1px);border-color:var(--acc)}.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--panel);box-shadow:0 3px 10px color-mix(in srgb,var(--acc) 20%,transparent)}
.btn{cursor:pointer;background:var(--acc);border-color:var(--acc);color:var(--panel);font-weight:500;min-width:96px;transition:.18s ease;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 18%,transparent)}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px color-mix(in srgb,var(--acc) 25%,transparent)}.btn:active{transform:translateY(0)}
label{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center}
input[type=search]{width:190px}.sp{margin-left:auto}
.desc{margin:0;padding:9px 12px;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.wrap{overflow:visible}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-size:13px}
td.l,th.l{text-align:left;font-family:var(--sans)}
thead th{position:sticky;top:0;z-index:2;background:var(--panel);padding:0;color:var(--mute);font:500 12px var(--sans);border-bottom:2px solid var(--line)}
th button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:9px 10px;text-align:right}
th.l button{text-align:left}th button:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{position:sticky;left:0;background:var(--panel)}
thead th:first-child{z-index:3}
tbody tr{animation:rowIn .24s ease both}tbody tr:hover td{background:var(--hover)}
.sym a{color:var(--ink);font-weight:600;text-decoration:none;font-family:var(--sans)}.sym a:hover{color:var(--acc);text-decoration:underline}
.ex{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.up{color:var(--up)}.dn{color:var(--dn)}.w{color:var(--warn);cursor:help}
.tag{font:500 12px var(--sans);padding:2px 9px;border-radius:4px;background:var(--accbg);color:var(--acc)}.tag.t{background:transparent;border:1px solid var(--up);color:var(--up)}
.rs{display:inline-flex;align-items:center;gap:7px}.rs i{display:block;height:5px;border-radius:3px;background:var(--acc);width:0;opacity:.8}.rs b{font-weight:500;min-width:20px}
.rk-ok{color:var(--up)}.rk-mid{color:var(--warn)}.rk-hi{color:var(--dn)}
.empty{padding:34px;text-align:center;color:var(--mute);font-family:var(--sans)}
.foot{padding:8px 12px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:1000px){.wrap{overflow-x:auto;scrollbar-width:thin}table{min-width:860px}}
@media(max-width:620px){.tab b{font-size:20px}.tab span{font-size:11.5px}.tab{padding:9px 10px}.sp{margin-left:0}input[type=search]{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="brand"><div class="logo">SQ</div><div><h1>Stock Scanner</h1><div class="sub" id="meta">Loading market data…</div></div></div>
<div style="display:flex;align-items:center;gap:12px"><div class="status"><i></i>EOD scanner</div><button class="ic" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button></div></div></header>
<main>
<div class="stale" id="stale"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;color:var(--mute);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.65px"><span>Market Intelligence</span><span>Stage 2 · Pullback · HTF</span></div>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="panel">
 <div class="tools">
  <div class="grp"><button class="chip" data-ex="ALL">All</button><button class="chip" data-ex="NSE">NSE</button><button class="chip" data-ex="BSE">BSE</button></div>
  <input type="search" id="q" placeholder="Search symbol  ( / )" aria-label="Search symbol">
  <div class="grp" id="filters"></div>
  <span class="sp"></span>
  <label>Copy as <select id="fmt"><option value="tv">TradingView</option><option value="plain">Plain symbols</option></select></label>
  <button class="btn" id="copy">Copy list</button>
 </div>
 <p class="desc" id="desc"></p>
 <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
 <div class="foot" id="foot"></div>
</section>
</main>
<script>
const SCANS={
 stage2:{t:'Strong Stage 2',d:'Trend template plus relative strength. A watchlist, not an entry signal.',sort:['rs',-1],
  cols:[['symbol','Symbol','l'],['exch','Exch','l'],['close','Close'],['chg','Chg %'],['rs','RS'],['ret1m','1M %'],['ret3m','3M %'],['ret6m','6M %'],['off_high','Off high %'],['adr','ADR %'],['spark','40 days']]},
 pullback:{t:'Pullback',d:'Close within the set % of EMA 11, EMA 21 or SMA 50. Entry above today’s high, stop at the 5-day low.',sort:['dist',1],
  cols:[['symbol','Symbol','l'],['exch','Exch','l'],['close','Close'],['chg','Chg %'],['level','Level','l'],['dist','Dist %'],['ret1m','1M %'],['ret3m','3M %'],['ret6m','6M %'],['entry','Entry'],['stop','Stop'],['risk','Risk %'],['spark','40 days']]},
 htf:{t:'High tight flag',d:'Big run-up then a tight flag. Forming: trigger above the flag high. Triggered: closed above it today.',sort:['gain',-1],
  cols:[['symbol','Symbol','l'],['exch','Exch','l'],['state','State','l'],['close','Close'],['gain','Run-up %'],['flag_days','Flag days'],['pullback','Flag dip %'],['entry','Entry'],['stop','Stop'],['risk','Risk %'],['spark','40 days']]}
};
const S={tab:'stage2',ex:'ALL',q:'',rs:70,off:'',lv:{EMA11:true,EMA21:true,SMA50:true},risk:'',st:'',fmt:'tv',key:'rs',dir:-1};
try{Object.assign(S,JSON.parse(localStorage.getItem('scn')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('scn',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
let D=null,SHOWN=[];
const f2=x=>x==null?'':Number(x).toLocaleString('en-IN',{maximumFractionDigits:2});
const val=(r,k)=>k==='dist'?Math.abs(r.dist):r[k];
const tv=r=>`https://www.tradingview.com/chart/?symbol=${r.exch}%3A${encodeURIComponent(r.symbol)}`;

function spark(a,up){if(!a||a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a),
 p=a.map((v,i)=>[(i/(a.length-1)*92+2).toFixed(1),(26-(v-mn)/(mx-mn||1)*22).toFixed(1)]),c=`var(${up?'--up':'--dn'})`,e=p[p.length-1];
 return `<svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><polyline points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="${e[0]}" cy="${e[1]}" r="2.4" fill="${c}"/></svg>`}
const heat=v=>v==null?'<td></td>':`<td class="${v>=0?'up':'dn'}" style="background:color-mix(in srgb,var(--${v>=0?'up':'dn'}) ${Math.min(26,Math.abs(v)/5)}%,transparent)">${v>=0?'+':''}${f2(v)}</td>`;
const CELL={
 symbol:r=>`<td class="sym l"><a href="${tv(r)}" target="_blank" rel="noopener" title="Open chart">${r.symbol}</a>${r.note?` <span class="w" title="${r.note.replace(/"/g,'&quot;')}">⚠</span>`:''}</td>`,
 exch:r=>`<td class="l"><span class="ex">${r.exch}</span></td>`,
 chg:r=>`<td class="${r.chg>=0?'up':'dn'}">${r.chg>=0?'+':''}${f2(r.chg)}</td>`,
 rs:r=>`<td><span class="rs"><i style="width:${r.rs*.4}px"></i><b>${r.rs}</b></span></td>`,
 ret1m:r=>heat(r.ret1m),ret3m:r=>heat(r.ret3m),ret6m:r=>heat(r.ret6m),
 dist:r=>`<td>${r.dist>=0?'+':''}${f2(r.dist)}</td>`,
 risk:r=>`<td class="${r.risk<=5?'rk-ok':r.risk<=10?'rk-mid':'rk-hi'}">${f2(r.risk)}</td>`,
 state:r=>`<td class="l"><span class="tag ${r.state==='Triggered'?'t':''}">${r.state}</span></td>`,
 level:r=>`<td class="l">${r.level}</td>`,
 spark:r=>`<td>${spark(r.spark,r.chg>=0)}</td>`
};
function rows(tab){const q=S.q.trim().toUpperCase();
 return D.scans[tab].filter(r=>(S.ex==='ALL'||r.exch===S.ex)&&(!q||r.symbol.includes(q))&&(
  tab==='stage2'?(r.rs>=S.rs&&(S.off===''||r.off_high<=+S.off)):
  tab==='pullback'?(S.lv[r.level]&&(S.risk===''||r.risk<=+S.risk)):
  ((S.st===''||r.state===S.st)&&(S.risk===''||r.risk<=+S.risk))))}

function render(){
 const sc=SCANS[S.tab],opt=(a,c,l)=>a.map(v=>`<option value="${v}"${String(c)===String(v)?' selected':''}>${l(v)}</option>`).join('');
 $('tabs').innerHTML=Object.keys(SCANS).map(k=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${k===S.tab}"><b>${rows(k).length}</b><span>${SCANS[k].t}</span></button>`).join('');
 document.querySelectorAll('[data-ex]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ex===S.ex));
 $('fmt').value=S.fmt;
 $('filters').innerHTML=S.tab==='stage2'?
  `<label>Min RS <select id="rs">${opt([70,80,90,95],S.rs,v=>v)}</select></label><label>Off 52W high <select id="off">${opt(['',25,15,10,5],S.off,v=>v===''?'any':'≤ '+v+'%')}</select></label>`:
  S.tab==='pullback'?Object.keys(S.lv).map(k=>`<button class="chip" data-lv="${k}" aria-pressed="${S.lv[k]}">${k}</button>`).join('')+
  `<label>Max risk <select id="risk">${opt(['',3,5,8,10],S.risk,v=>v===''?'any':v+'%')}</select></label>`:
  `<label>State <select id="st">${opt(['','Forming','Triggered'],S.st,v=>v||'all')}</select></label><label>Max risk <select id="risk">${opt(['',10,15,20],S.risk,v=>v===''?'any':v+'%')}</select></label>`;
 const m=D.config&&D.config.momentum,et=D.config&&D.config.ema_then;
 $('desc').textContent=sc.d+(m&&m.enabled&&m.apply_to.includes(S.tab)?` Momentum filter (${m.match==='any'?'any one of':'all of'}): ${m.min_pct['1m']}% in 1M, ${m.min_pct['3m']}% in 3M, ${m.min_pct['6m']}% in 6M.`:'')+(et&&et.enabled&&et.apply_to.includes(S.tab)?` Also above EMA 21 ${et.days_ago} trading days ago.`:'');
 $('thead').innerHTML='<tr>'+sc.cols.map(([k,t,c])=>k==='spark'?`<th><button style="cursor:default">${t}</button></th>`:
  `<th class="${c||''}"><button data-sort="${k}">${t}${S.key===k?(S.dir>0?' ▲':' ▼'):''}</button></th>`).join('')+'</tr>';
 SHOWN=rows(S.tab).sort((a,b)=>{const x=val(a,S.key),y=val(b,S.key);return (typeof x==='string'?x.localeCompare(y):(x??-1e9)-(y??-1e9))*S.dir});
 $('tbody').innerHTML=SHOWN.length?SHOWN.map(r=>'<tr>'+sc.cols.map(([k])=>CELL[k]?CELL[k](r):`<td>${f2(r[k])}</td>`).join('')+'</tr>').join('')
  :`<tr><td colspan="${sc.cols.length}" class="empty">No stocks match these filters. Loosen a filter above.</td></tr>`;
 $('foot').textContent=`Showing ${SHOWN.length} of ${D.scans[S.tab].length}. Click a symbol to open its chart. ⚠ means check the chart: a corporate action may be unadjusted.`;
 save();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]'),x=e.target.closest('[data-ex]'),s=e.target.closest('[data-sort]'),l=e.target.closest('[data-lv]');
 if(t){S.tab=t.dataset.tab;[S.key,S.dir]=SCANS[S.tab].sort}
 else if(x)S.ex=x.dataset.ex;
 else if(l)S.lv[l.dataset.lv]=!S.lv[l.dataset.lv];
 else if(s){const k=s.dataset.sort;S.dir=S.key===k?-S.dir:(['symbol','exch','level','state'].includes(k)?1:-1);S.key=k}
 else if(e.target.id==='copy'){const sy=SHOWN.map(r=>S.fmt==='tv'?`${r.exch}:${r.symbol}`:r.symbol),b=e.target;
  navigator.clipboard.writeText(S.fmt==='tv'?sy.join(','):sy.join('\n')).then(()=>{b.textContent=`Copied ${sy.length}`;setTimeout(()=>b.textContent='Copy list',1500)});return}
 else if(e.target.id==='theme'){const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.dataset.theme=d==='dark'?'light':'dark';try{localStorage.setItem('scn-theme',r.dataset.theme)}catch(_){}return}
 else return;
 render();
});
document.addEventListener('change',e=>{const i=e.target.id;
 if(i==='rs')S.rs=+e.target.value;else if(i==='off')S.off=e.target.value;else if(i==='risk')S.risk=e.target.value;
 else if(i==='st')S.st=e.target.value;else if(i==='fmt')S.fmt=e.target.value;else return;render()});
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('q').focus()}});
try{const th=localStorage.getItem('scn-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}

fetch('data/results.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 D=d;$('q').value=S.q;if(!SCANS[S.tab])S.tab='stage2';
 $('meta').textContent=`${d.asof}  ·  ${d.stats.traded_last_day.toLocaleString('en-IN')} stocks traded  ·  updated ${d.generated.replace('T',' ')}`;
 const age=(Date.now()-new Date(d.asof))/864e5;
 if(age>4){$('stale').style.display='block';$('stale').textContent=`Data is ${Math.floor(age)} days old. Run ./run_daily.sh to refresh.`}
 render();
}).catch(()=>{$('meta').textContent='Could not load data/results.json. Run ./run_daily.sh and open http://localhost:8000/dashboard.html (double-clicking the file will not work).'});
</script>
</body>
</html>
