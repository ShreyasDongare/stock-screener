<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Scanner • Market Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#EEF1F4;--panel:#fff;--ink:#16212B;--mute:#68788A;--line:#DCE2E8;--hover:#F2F6FA;--up:#17794F;--dn:#B83232;--acc:#2A5A8E;--accbg:#E2ECF6;--warn:#B16A00;--hdr:#15212C;--hdrink:#fff;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1419;--panel:#171E26;--ink:#E5EAF0;--mute:#8797A8;--line:#27313C;--hover:#1D2630;--up:#3FBE8C;--dn:#E56C6C;--acc:#80B2E6;--accbg:#223347;--warn:#E2A446;--hdr:#0B0F13}}
:root[data-theme="dark"]{--bg:#0F1419;--panel:#171E26;--ink:#E5EAF0;--mute:#8797A8;--line:#27313C;--hover:#1D2630;--up:#3FBE8C;--dn:#E56C6C;--acc:#80B2E6;--accbg:#223347;--warn:#E2A446;--hdr:#0B0F13}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(circle at 12% -8%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 30%),radial-gradient(circle at 90% 18%,color-mix(in srgb,var(--up) 7%,transparent),transparent 24%),var(--bg);color:var(--ink);font:14px/1.45 var(--sans);min-height:100vh}
@keyframes smoothEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes softPulse{0%,100%{opacity:.72}50%{opacity:1}}
.top{background:linear-gradient(135deg,#101820,var(--hdr));color:var(--hdrink);box-shadow:0 8px 28px rgba(0,0,0,.16);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -10% -55% 35%;height:180px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 22%,transparent),transparent 68%);pointer-events:none}
.in{width:calc(100% - 40px);max-width:none;margin:0 auto;padding:21px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:0}
h1{font-size:25px;font-weight:600;margin:0;letter-spacing:-.45px}
.sub{color:#AEBBC8;font-size:12px;margin-top:5px;font-family:var(--mono);letter-spacing:.15px}
.status{display:flex;align-items:center;gap:8px;color:#C9D5E1;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.75px}
.status i{width:7px;height:7px;border-radius:50%;background:#45C98D;box-shadow:0 0 0 4px rgba(69,201,141,.12);animation:softPulse 2.4s ease-in-out infinite}
.ic{background:rgba(255,255,255,.05);border:1px solid #3A4856;color:var(--hdrink);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;transition:background .22s ease,transform .22s ease,border-color .22s ease}.ic:hover{background:rgba(255,255,255,.11);transform:translateY(-1px);border-color:#526273}
main{width:calc(100% - 40px);max-width:none;height:calc(100vh - 86px);margin:0 auto;padding:22px 0 20px;display:flex;flex-direction:column;overflow:hidden}
.stale{display:none;background:var(--accbg);border-left:4px solid var(--warn);padding:9px 12px;border-radius:4px;margin-bottom:12px}
.section-kicker{display:flex;justify-content:space-between;align-items:center;margin:0 2px 11px;color:var(--mute);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.8px}
.dashboard-grid{display:grid;grid-template-columns:225px minmax(0,1fr);gap:16px;align-items:stretch;min-height:0;flex:1;overflow:hidden}
.tabs{display:flex;flex-direction:column;gap:10px;margin:0;position:static;align-self:stretch;height:auto;min-height:0}
.tab{width:100%;min-height:92px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 98%,var(--acc)),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 17px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s cubic-bezier(.2,.7,.2,1),border-color .28s ease,background .28s ease}
.tab:hover{transform:translateX(2px);box-shadow:0 12px 26px rgba(0,0,0,.08);border-color:color-mix(in srgb,var(--acc) 42%,var(--line))}
.tab:active{transform:translateX(0)}
.tab b{display:block;font:500 29px/1.1 var(--mono);letter-spacing:-.5px}.tab span{color:var(--mute);font-size:12.5px}
.tab[aria-selected="true"]{border-color:color-mix(in srgb,var(--acc) 68%,var(--line));background:linear-gradient(180deg,var(--accbg),var(--panel));box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 11%,transparent)}
.copy-all{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:600 12px var(--sans);cursor:pointer;transition:.2s}.copy-all:hover{border-color:var(--acc);background:var(--accbg);transform:translateY(-1px)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:auto;right:0;top:15px;bottom:15px;width:2px;background:var(--acc);border-radius:2px;transform-origin:center;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(15,30,45,.065);overflow:hidden;animation:smoothEnter .38s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column;min-height:0}
.tools{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 95%,var(--bg))}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,select,input,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 11px;font:inherit}
.chip{border-radius:999px;cursor:pointer;transition:background .22s ease,border-color .22s ease,transform .22s ease,box-shadow .22s ease}.chip:hover{transform:translateY(-1px);border-color:var(--acc)}.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--panel);box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 18%,transparent)}
.btn{cursor:pointer;background:var(--acc);border-color:var(--acc);color:var(--panel);font-weight:500;min-width:96px;transition:background .22s ease,transform .22s ease,box-shadow .22s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 22%,transparent)}.btn:active{transform:translateY(0)}
label{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center}
input[type=search]{width:190px}.sp{margin-left:auto}
.desc{margin:0;padding:9px 12px;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.wrap{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mute) 42%,transparent) transparent;scrollbar-gutter:stable}
.wrap::-webkit-scrollbar{width:8px;height:8px}
.wrap::-webkit-scrollbar-track{background:transparent;margin:8px 0}
.wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 62%,var(--mute)),color-mix(in srgb,var(--acc) 42%,var(--mute)));border:2px solid transparent;background-clip:padding-box;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--panel) 18%,transparent);min-height:44px}
.wrap::-webkit-scrollbar-thumb:hover{background:var(--acc);border:1px solid transparent;background-clip:padding-box;box-shadow:0 0 10px color-mix(in srgb,var(--acc) 28%,transparent)}
.wrap::-webkit-scrollbar-thumb:active{background:var(--acc)}
.wrap::-webkit-scrollbar-corner{background:transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-size:13px}
td.l,th.l{text-align:left;font-family:var(--sans)}
thead th{position:sticky;top:0;z-index:2;background:var(--panel);padding:0;color:var(--mute);font:500 12px var(--sans);border-bottom:2px solid var(--line)}
th button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:9px 10px;text-align:right}
th:has(button[data-sort="adx"]),td:has(.adx-cell){min-width:64px}
th.l button{text-align:left}th button:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{position:sticky;left:0;background:var(--panel)}
thead th:first-child{z-index:3}
tbody tr{transition:background .2s ease,transform .2s ease}tbody tr:hover td{background:var(--hover)}
.sym a{color:var(--ink);font-weight:600;text-decoration:none;font-family:var(--sans)}.sym a:hover{color:var(--acc);text-decoration:underline}
.ex{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.up{color:var(--up)}.dn{color:var(--dn)}.w{color:var(--warn);cursor:help}
.tag{font:500 12px var(--sans);padding:2px 9px;border-radius:4px;background:var(--accbg);color:var(--acc)}.tag.t{background:transparent;border:1px solid var(--up);color:var(--up)}
.rs{display:inline-flex;align-items:center;gap:7px}.rs i{display:block;height:5px;border-radius:3px;background:var(--acc);width:0;opacity:.8}.rs b{font-weight:500;min-width:20px}
.rk-ok{color:var(--up)}.rk-mid{color:var(--warn)}.rk-hi{color:var(--dn)}
.empty{padding:34px;text-align:center;color:var(--mute);font-family:var(--sans)}
.foot{padding:8px 12px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:1000px){.dashboard-grid{grid-template-columns:205px minmax(0,1fr);gap:12px}.wrap{overflow:auto;scrollbar-width:thin}table{min-width:860px}}
@media(max-width:720px){html,body{height:auto;overflow:auto}.in,main{width:calc(100% - 24px)}main{height:auto;overflow:visible;padding-bottom:28px}.dashboard-grid{grid-template-columns:1fr;overflow:visible}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;position:static}.tab{min-height:78px}.panel{min-height:520px}.wrap{overflow:auto;max-height:60vh}.section-kicker{font-size:9.5px}}
@media(max-width:420px){.in,main{width:calc(100% - 18px)}.tabs{grid-template-columns:1fr}.tab b{font-size:20px}.tab span{font-size:11.5px}.sp{margin-left:0}input[type=search]{width:100%}}
/* In-dashboard interactive EOD chart */
.chart-link{all:unset;cursor:pointer;color:var(--ink);font-weight:600;font-family:var(--sans)}
.chart-link:hover{color:var(--acc);text-decoration:underline}
.chart-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(5,12,20,.62);backdrop-filter:blur(6px)}
.chart-modal.open{display:flex}
.chart-box{width:min(1520px,98vw);height:min(900px,96vh);background:#0d131a;border:1px solid #293542;border-radius:14px;box-shadow:0 28px 100px rgba(0,0,0,.48);display:flex;flex-direction:column;overflow:hidden}
.chart-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#101820;border-bottom:1px solid #293542;min-height:58px}
.chart-title{font:700 17px var(--sans);color:#E8EEF5;letter-spacing:-.2px}
.chart-meta{color:#8191A1;font:11px var(--mono);margin-left:2px}
.chart-close{margin-left:auto;border:1px solid #344352;background:#151E27;color:#B9C6D3;border-radius:7px;padding:6px 10px;cursor:pointer}.chart-close:hover{background:#202B36;color:#fff}
.chart-body{position:relative;flex:1;min-height:0;padding:0;display:flex}.chart-watchlist{width:190px;flex:0 0 190px;background:#101820;border-right:1px solid #293542;overflow:auto;padding:8px}.chart-watch-title{color:#8191A1;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.7px;padding:5px 7px 9px}.chart-watch-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 7px;margin:2px 0;border:1px solid transparent;border-radius:6px;background:transparent;color:#B9C6D3;text-align:left;font:500 11px var(--mono);cursor:pointer}.chart-watch-item:hover{background:#182430;border-color:#2D4254}.chart-watch-item.active{background:#20354A;border-color:#4D87C2;color:#fff}.chart-watch-item .wsetup{color:#8191A1;font-size:9px;margin-left:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chart-watch-item.active .wsetup{color:#AFC8DF}.chart-host{position:relative;flex:1;min-width:0;inset:auto}
.chart-tooltip{position:absolute;z-index:4;pointer-events:none;display:none;min-width:190px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(4px);font:11px/1.45 var(--mono);color:var(--ink)}
.chart-tooltip .tt-date{font-weight:600;margin-bottom:4px}.chart-tooltip .tt-grid{display:grid;grid-template-columns:auto auto;gap:2px 12px}
.chart-controls{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid #293542;background:#101820}
.chart-controls button{border:1px solid #344352;background:#151E27;color:#93A3B3;border-radius:6px;padding:5px 11px;font:500 11px var(--sans);cursor:pointer}.chart-controls button:hover,.chart-controls button.active{color:#fff;border-color:#4D87C2;background:#20354A}
.chart-controls .hint{margin-left:auto;color:var(--mute);font:11px var(--mono)}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:7px 14px;color:#8191A1;background:#0D131A;font:11px var(--sans);border-top:1px solid #293542}
.chart-legend b{color:#DDE6EF}
@media(max-width:720px){.chart-modal{padding:6px}.chart-box{width:100%;height:94vh;border-radius:12px}.chart-head{padding:9px 11px}.chart-meta{font-size:10px}.chart-controls .hint{display:none}.chart-legend{padding:6px 10px;gap:9px}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="brand"><div><h1>Momentum Scanner</h1><div class="sub" id="meta">Loading market intelligence…</div></div></div>
<div style="display:flex;align-items:center;gap:12px"><div class="status"><i></i>LIVE DATA ENGINE</div><button class="ic" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button></div></div></header>
<main>
<div class="stale" id="stale"></div>
<div class="section-kicker"><span>Momentum Intelligence</span><span>Stage 2 · Pullback · Breakout / HTF · EP</span></div>
<div class="dashboard-grid">
  <aside><div class="tabs" id="tabs" role="tablist" aria-label="Scanner types"></div><button class="copy-all" id="copyAll">Copy All Stocks</button></aside>
  <section class="panel">
 <div class="tools">
  <div class="grp"><button class="chip" data-ex="ALL">All</button><button class="chip" data-ex="NSE">NSE</button><button class="chip" data-ex="BSE">BSE</button></div>
  <input type="search" id="q" placeholder="Search symbol  ( / )" aria-label="Search symbol">
  <div class="grp" id="filters"></div>
  <span class="sp"></span>

 </div>
 <p class="desc" id="desc"></p>
 <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
 <div class="foot" id="foot"></div>
  </section>
</div>
</main>
<div class="chart-modal" id="chartModal" role="dialog" aria-modal="true" aria-label="Stock chart">
  <div class="chart-box">
    <div class="chart-head"><div class="chart-title" id="chartTitle">Chart</div><div class="chart-meta" id="chartMeta"></div><div id="chartStats" style="display:flex;gap:14px;margin-left:10px;align-items:center;font:11px var(--mono)"></div><button class="chart-close" id="chartClose" aria-label="Close chart">✕</button></div>
    <div class="chart-body" id="chartBody"></div>
    <div class="chart-controls"><button id="chartReset">Reset</button><button id="chartFit">Fit</button><button id="chart120">120D</button><button id="chart60">60D</button><button id="chart30">30D</button><button id="chartFullscreen">⛶ Fullscreen</button><span class="hint">Scroll = zoom · Drag = pan · Crosshair = price/time</span></div><div class="chart-legend"><span>● <b>Price</b></span><span style="color:#58A6E6">━ EMA11</span><span style="color:#E7B84B">━ EMA21</span><span style="color:#B17DE6">━ SMA50</span><span>▮ Volume</span><span style="margin-left:auto">Scroll zoom · Drag pan · Crosshair price/time</span></div>
  </div>
</div>
<script>
const SCANS = {
  stage2: {
    t: "Strong Stage 2",
    d: "Trend template plus relative strength. A watchlist, not an entry signal.",
    sort: ["rs", -1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["close","Close"],["chg","Chg %"],["rs","RS"],["adx","ADX"],["ret1m","1M %"],["ret3m","3M %"],["ret6m","6M %"],["off_high","Off high %"],["adr","ADR %"],["spark","40 days"]]
  },
  pullback: {
    t: "Pullback",
    d: "Close within the set % of EMA 11, EMA 21 or SMA 50. Entry above today's high, stop at the 5-day low.",
    sort: ["dist", 1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["close","Close"],["chg","Chg %"],["adx","ADX"],["level","Level","l"],["dist","Dist %"],["ret1m","1M %"],["ret3m","3M %"],["ret6m","6M %"],["entry","Entry"],["stop","Stop"],["risk","Risk %"],["spark","40 days"]]
  },
  breakout_htf: {
    t: "Breakout / HTF",
    d: "Combined view of tight-flag Breakout and High Tight Flag candidates.",
    sort: ["gain", -1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["setup","Setup","l"],["state","State","l"],["close","Close"],["adx","ADX"],["gain","Run-up %"],["flag_days","Flag days"],["depth","Dip %"],["entry","Entry"],["stop","Stop"],["risk","Risk %"],["spark","40 days"]]
  },
  ep: {
    t: "Episodic Pivot",
    d: "Gap-up on heavy volume after a quiet stretch. Entry above the EP-day high, stop at its low.",
    sort: ["vol_ratio", -1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["state","State","l"],["close","Close"],["adx","ADX"],["gap","Gap %"],["vol_ratio","Vol x"],["prior_3m","Prior 3M %"],["adr","ADR %"],["entry","Entry"],["stop","Stop"],["risk","Risk %"],["spark","40 days"]]
  }
};

const DEFAULT_STATE = { tab: "stage2", ex: "ALL", q: "", rs: 70, off: "", lv: {EMA11:true,EMA21:true,SMA50:true}, risk:"", st:"", key:"rs", dir:-1 };
let S = {...DEFAULT_STATE};
try {
  const saved = JSON.parse(localStorage.getItem("scn") || "{}");
  S = {...DEFAULT_STATE, ...saved, lv:{...DEFAULT_STATE.lv, ...(saved.lv||{})}};
  if (!SCANS[S.tab]) S.tab = "stage2";
} catch (_) {}

const $ = id => document.getElementById(id);
const f2 = x => x == null || !Number.isFinite(Number(x)) ? "" : Number(x).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc = x => String(x ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
let D = null, SHOWN = [];

function sourceRows(tab){
  if (!D || !D.scans) return [];
  if (tab === "breakout_htf") {
    const bo = (D.scans.breakout || []).map(r => ({...r, setup:"Breakout", gain:r.runup ?? 0, depth:r.depth ?? null}));
    const hf = (D.scans.htf || []).map(r => ({...r, setup:"HTF", gain:r.gain ?? 0, depth:r.pullback ?? null}));
    return bo.concat(hf);
  }
  return D.scans[tab] || [];
}

function rows(tab){
  const q = S.q.trim().toUpperCase();
  return sourceRows(tab).filter(r => {
    if (S.ex !== "ALL" && r.exch !== S.ex) return false;
    if (q && !String(r.symbol || "").toUpperCase().includes(q)) return false;
    if (tab === "stage2") return Number(r.rs || 0) >= Number(S.rs) && (S.off === "" || Number(r.off_high) <= Number(S.off));
    if (tab === "pullback") return !!S.lv[r.level] && (S.risk === "" || Number(r.risk) <= Number(S.risk));
    return (S.st === "" || r.state === S.st) && (S.risk === "" || Number(r.risk) <= Number(S.risk));
  });
}

function valueFor(r,key){
  if(key === "dist") return Math.abs(Number(r.dist || 0));
  if(key === "gain") return Number(r.gain || 0);
  return r[key];
}

function spark(a, up){
  if(!Array.isArray(a) || a.length < 2) return "";
  const vals = a.map(Number).filter(Number.isFinite);
  if(vals.length < 2) return "";
  const mn=Math.min(...vals), mx=Math.max(...vals), den=mx-mn || 1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1)*92+2).toFixed(1),(26-(v-mn)/den*22).toFixed(1)]);
  const col = `var(${up ? "--up" : "--dn"})`;
  const last=pts[pts.length-1];
  return `<svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.3" fill="${col}"/></svg>`;
}

function heat(v){
  if(v == null || !Number.isFinite(Number(v))) return "<td></td>";
  const n=Number(v), cls=n>=0?"up":"dn";
  return `<td class="${cls}">${n>=0?"+":""}${f2(n)}</td>`;
}

const CELL = {
  symbol:r=>`<td class="sym l"><button class="chart-link" data-chart-key="${esc(r.key)}" title="Open EOD chart">${esc(r.symbol)}</button>${r.note ? ` <span class="w" title="${esc(r.note)}">⚠</span>` : ""}</td>`,
  exch:r=>`<td class="l"><span class="ex">${esc(r.exch)}</span></td>`,
  setup:r=>`<td class="l"><span class="tag">${esc(r.setup)}</span></td>`,
  state:r=>`<td class="l"><span class="tag ${r.state==="Triggered"?"t":""}">${esc(r.state)}</span></td>`,
  chg:r=>`<td class="${Number(r.chg)>=0?"up":"dn"}">${Number(r.chg)>=0?"+":""}${f2(r.chg)}</td>`,
  rs:r=>`<td><span class="rs"><i style="width:${Math.min(40,Number(r.rs||0)*.4)}px"></i><b>${f2(r.rs)}</b></span></td>`,
  adx:r=>`<td class="adx-cell">${f2(r.adx)}</td>`,
  ret1m:r=>heat(r.ret1m), ret3m:r=>heat(r.ret3m), ret6m:r=>heat(r.ret6m),
  dist:r=>`<td>${Number(r.dist)>=0?"+":""}${f2(r.dist)}</td>`,
  risk:r=>`<td class="${Number(r.risk)<=5?"rk-ok":Number(r.risk)<=10?"rk-mid":"rk-hi"}">${f2(r.risk)}</td>`,
  level:r=>`<td class="l">${esc(r.level)}</td>`,
  spark:r=>`<td>${spark(r.spark,Number(r.chg)>=0)}</td>`
};

function options(values,current,label){
  return values.map(v=>`<option value="${esc(v)}" ${String(v)===String(current)?"selected":""}>${label(v)}</option>`).join("");
}

let LW = null;
let CHART = null, CHART_ROW = null;

function chartTheme(){
  const dark=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim().startsWith("#") &&
    matchMedia("(prefers-color-scheme: dark)").matches;
  const root=document.documentElement, explicit=root.dataset.theme;
  const isDark=explicit==="dark" || (!explicit && matchMedia("(prefers-color-scheme: dark)").matches);
  return {
    textColor:isDark?"#B7C3CF":"#5D6B78",
    gridColor:isDark?"rgba(140,155,170,.10)":"rgba(70,90,110,.10)",
    bg:isDark?"#171E26":"#FFFFFF",
    up:isDark?"#3FBE8C":"#17794F",
    down:isDark?"#E56C6C":"#B83232",
    ema11:isDark?"#80B2E6":"#2A5A8E",
    ema21:isDark?"#3FBE8C":"#17794F",
    sma50:isDark?"#9AA7B5":"#68788A"
  };
}

function closeChart(){
  $("chartModal").classList.remove("open");
  if(LW){ try{LW.remove();}catch(_){} LW=null; }
  CHART_ROW=null;
  $("chartBody").innerHTML="";
}

function makeSeries(chart, type, options){
  if(type==="candlestick") return chart.addSeries(LightweightCharts.CandlestickSeries,options);
  if(type==="histogram") return chart.addSeries(LightweightCharts.HistogramSeries,options);
  return chart.addSeries(LightweightCharts.LineSeries,options);
}

function chartRows(){
  if(!D) return [];
  const all=[];
  Object.keys(SCANS).forEach(tab=>sourceRows(tab).forEach(r=>all.push({...r,watchSetup:r.setup||SCANS[tab].t})));
  const seen=new Set();
  return all.filter(r=>r.key && !seen.has(r.key) && CHART?.[r.key] && seen.add(r.key));
}
function renderChartWatchlist(activeKey){
  const el=$("chartWatchlist"); if(!el) return;
  const items=chartRows();
  el.innerHTML='<div class="chart-watch-title">Scanned Stocks · '+items.length+'</div>'+items.map(r=>'<button class="chart-watch-item '+(r.key===activeKey?'active':'')+'" data-watch-key="'+esc(r.key)+'"><span>'+esc(r.symbol)+'</span><span class="wsetup">'+esc(r.watchSetup||"")+'</span></button>').join("");
}

function openChart(key,row){
  if(!CHART || !CHART[key] || typeof LightweightCharts==="undefined") return;
  const d=CHART[key], n=d.dates.length;
  const dark=true;
  CHART_ROW=row||null;
  const last=n-1, close=Number(d.close[last]), prev=n>1?Number(d.close[last-1]):NaN;
  const dayPct=Number.isFinite(prev)&&prev!==0?(close/prev-1)*100:NaN;
  const entry=Number(row?.entry), stop=Number(row?.stop);
  const fmt=x=>Number.isFinite(x)?x.toLocaleString("en-IN",{maximumFractionDigits:2}):"—";

  $("chartTitle").textContent=d.exch+":"+d.symbol;
  $("chartMeta").textContent=d.dates[0]+" → "+d.dates[last]+" · "+n+" sessions · EOD";
  $("chartStats").innerHTML=
    '<span style="color:#DDE6EF">₹'+fmt(close)+'</span>'+
    '<span style="color:'+(dayPct>=0?'#45C98D':'#E56C6C')+'">'+(dayPct>=0?'+':'')+fmt(dayPct)+'%</span>'+
    (Number.isFinite(row?.adx)?'<span style="color:#9FB0C0">ADX '+fmt(Number(row.adx))+'</span>':'')+
    (row?.setup?'<span style="color:#80B2E6">'+esc(row.setup)+'</span>':'')+
    (Number.isFinite(entry)?'<span style="color:#45C98D">Entry ₹'+fmt(entry)+'</span>':'')+
    (Number.isFinite(stop)?'<span style="color:#E56C6C">SL ₹'+fmt(stop)+'</span>':'');

  $("chartBody").innerHTML='<aside class="chart-watchlist" id="chartWatchlist"></aside><div class="chart-host" id="chartHost"></div>';
  $("chartModal").classList.add("open");
  renderChartWatchlist(key);
  const host=$("chartHost");

  const chart=LightweightCharts.createChart(host,{
    width:host.clientWidth,height:host.clientHeight,
    layout:{background:{type:LightweightCharts.ColorType.Solid,color:"#0D131A"},textColor:"#91A2B3",fontFamily:"IBM Plex Mono, monospace",fontSize:11},
    grid:{vertLines:{color:"rgba(125,145,165,.075)"},horzLines:{color:"rgba(125,145,165,.075)"}},
    rightPriceScale:{borderColor:"#293542",scaleMargins:{top:.06,bottom:.24},minimumWidth:74},
    timeScale:{borderColor:"#293542",timeVisible:false,secondsVisible:false,rightOffset:6,barSpacing:8,minBarSpacing:2},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:"#71869B",width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:"#33485B"},horzLine:{color:"#71869B",width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:"#33485B"}},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:{time:true,price:true},axisDoubleClickReset:true},
    localization:{priceFormatter:p=>Number(p).toLocaleString("en-IN",{maximumFractionDigits:2})}
  });
  LW=chart;

  const candles=d.dates.map((time,i)=>({time,open:+d.open[i],high:+d.high[i],low:+d.low[i],close:+d.close[i]})).filter(x=>[x.open,x.high,x.low,x.close].every(Number.isFinite));
  const candle=chart.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:"#20A46B",downColor:"#D95353",borderUpColor:"#20A46B",borderDownColor:"#D95353",wickUpColor:"#20A46B",wickDownColor:"#D95353",
    priceLineVisible:false,lastValueVisible:true
  });
  candle.setData(candles);

  if(Number.isFinite(entry)) candle.createPriceLine({price:entry,color:"#45C98D",lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:"ENTRY"});
  if(Number.isFinite(stop)) candle.createPriceLine({price:stop,color:"#E56C6C",lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:"STOP"});

  const ema11=chart.addSeries(LightweightCharts.LineSeries,{color:"#58A6E6",lineWidth:2,lastValueVisible:false,priceLineVisible:false});
  const ema21=chart.addSeries(LightweightCharts.LineSeries,{color:"#E7B84B",lineWidth:2,lastValueVisible:false,priceLineVisible:false});
  const sma50=chart.addSeries(LightweightCharts.LineSeries,{color:"#B17DE6",lineWidth:2,lastValueVisible:false,priceLineVisible:false});
  ema11.setData(d.dates.map((time,i)=>({time,value:+d.ema11[i]})).filter(x=>Number.isFinite(x.value)));
  ema21.setData(d.dates.map((time,i)=>({time,value:+d.ema21[i]})).filter(x=>Number.isFinite(x.value)));
  sma50.setData(d.dates.map((time,i)=>({time,value:+d.sma50[i]})).filter(x=>Number.isFinite(x.value)));

  const volume=chart.addSeries(LightweightCharts.HistogramSeries,{
    priceFormat:{type:"volume"},priceScaleId:"volume",lastValueVisible:false,priceLineVisible:false,
    color:"#3E5368"
  });
  volume.priceScale().applyOptions({scaleMargins:{top:.83,bottom:0},borderVisible:false});
  volume.setData(d.dates.map((time,i)=>({
    time,value:+d.volume[i],color:+d.close[i]>=+d.open[i]?"rgba(32,164,107,.55)":"rgba(217,83,83,.55)"
  })).filter(x=>Number.isFinite(x.value)));

  // Setup marker on the latest relevant day.
  try{
    const markerSeries=candle;
    const markers=[];
    if(row?.setup || S.tab==="ep" || S.tab==="breakout_htf" || S.tab==="pullback"){
      markers.push({time:d.dates[last],position:"belowBar",color:"#45C98D",shape:"arrowUp",text:row?.setup||SCANS[S.tab].t});
    }
    if(markers.length) markerSeries.setMarkers(markers);
  }catch(_){}



  const resize=()=>{if(LW)LW.applyOptions({width:host.clientWidth,height:host.clientHeight});};
  const ro=new ResizeObserver(resize);ro.observe(host);
  chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-120),to:n+5});
  requestAnimationFrame(resize);
}
function render(){
  if(!D) return;
  const sc=SCANS[S.tab];
  Object.keys(SCANS).forEach(k=>{});
  $("tabs").innerHTML=Object.keys(SCANS).map(k=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${k===S.tab}"><b>${rows(k).length}</b><span>${sc===SCANS[k]?SCANS[k].t:SCANS[k].t}</span></button>`).join("");
  document.querySelectorAll("[data-ex]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ex===S.ex));
  let filterHTML="";
  if(S.tab==="stage2"){
    filterHTML=`<label>Min RS <select id="rs">${options([70,80,90,95],S.rs,v=>v)}</select></label><label>Off 52W high <select id="off">${options(["",25,15,10,5],S.off,v=>v===""?"Any":"≤ "+v+"%")}</select></label>`;
  } else if(S.tab==="pullback"){
    filterHTML=Object.keys(S.lv).map(k=>`<button class="chip" data-lv="${k}" aria-pressed="${S.lv[k]}">${k}</button>`).join("")+
      `<label>Max risk <select id="risk">${options(["",3,5,8,10],S.risk,v=>v===""?"Any":v+"%")}</select></label>`;
  } else {
    const states=S.tab==="breakout_htf"?["","Setup","Forming","Triggered"]:["","Today","1d ago","2d ago"];
    filterHTML=`<label>State <select id="st">${options(states,S.st,v=>v||"Any")}</select></label><label>Max risk <select id="risk">${options(["",5,8,10,15,20],S.risk,v=>v===""?"Any":v+"%")}</select></label>`;
  }
  $("filters").innerHTML=filterHTML;
  $("desc").textContent=sc.d;
  $("thead").innerHTML="<tr>"+sc.cols.map(([k,t,cl])=>`<th class="${cl||""}"><button data-sort="${k}">${t}${S.key===k?(S.dir>0?" ▲":" ▼"):""}</button></th>`).join("")+"</tr>";
  SHOWN=rows(S.tab).sort((a,b)=>{
    const x=valueFor(a,S.key), y=valueFor(b,S.key);
    if(typeof x==="string" || typeof y==="string") return S.dir*String(x??"").localeCompare(String(y??""));
    return S.dir*((Number(x)||0)-(Number(y)||0));
  });
  $("tbody").innerHTML=SHOWN.length ? SHOWN.map(r=>"<tr>"+sc.cols.map(([k])=>CELL[k]?CELL[k](r):`<td>${f2(r[k])}</td>`).join("")+"</tr>").join("") : `<tr><td colspan="${sc.cols.length}" class="empty">No stocks match these filters.</td></tr>`;
  $("foot").textContent=`Showing ${SHOWN.length} of ${sourceRows(S.tab).length}. Click a symbol to open its chart. ⚠ means check the chart: a corporate action may be unadjusted.`;
  try { localStorage.setItem("scn",JSON.stringify(S)); } catch (_) {}
}

function wire(){
  document.addEventListener("click",e=>{
    const chartBtn=e.target.closest("[data-chart-key]");
    const watchBtn=e.target.closest("[data-watch-key]");
    if(watchBtn){ const key=watchBtn.dataset.watchKey; const r=chartRows().find(x=>x.key===key); openChart(key,r); return; }
    if(chartBtn){ const r=Object.values(D.scans||{}).flat().find(x=>x.key===chartBtn.dataset.chartKey); openChart(chartBtn.dataset.chartKey,r); return; }
    const t=e.target.closest("[data-tab]"), x=e.target.closest("[data-ex]"), s=e.target.closest("[data-sort]"), l=e.target.closest("[data-lv]");
    if(t){S.tab=t.dataset.tab;S.st="";[S.key,S.dir]=SCANS[S.tab].sort;render();return}
    if(x){S.ex=x.dataset.ex;render();return}
    if(l){S.lv[l.dataset.lv]=!S.lv[l.dataset.lv];render();return}
    if(s){const k=s.dataset.sort;S.dir=S.key===k?-S.dir:1;S.key=k;render();return}
    if(e.target.id==="copyAll"){
      const all=[];
      Object.keys(SCANS).forEach(tab=>sourceRows(tab).forEach(r=>{if(r.symbol) all.push(r.symbol)}));
      const sy=[...new Set(all)];
      navigator.clipboard?.writeText(sy.join("\n")).then(()=>{
        const b=e.target, old=b.textContent; b.textContent="Copied "+sy.length+" Stocks"; setTimeout(()=>b.textContent=old,1400);
      }).catch(()=>{});
      return;
    }
    if(e.target.id==="theme"){
      const root=document.documentElement, current=root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      root.dataset.theme=current==="dark"?"light":"dark";
      try{localStorage.setItem("scn-theme",root.dataset.theme)}catch(_){}
      return;
    }
  });
  document.addEventListener("change",e=>{
    const id=e.target.id;
    if(id==="rs")S.rs=Number(e.target.value);
    else if(id==="off")S.off=e.target.value;
    else if(id==="risk")S.risk=e.target.value;
    else if(id==="st")S.st=e.target.value;
    else if(id==="fmt")S.fmt=e.target.value;
    else return;
    render();
  });
  $("q").addEventListener("input",e=>{S.q=e.target.value;render()});
  document.addEventListener("keydown",e=>{if(e.key==="/" && document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus()}});
}

$("chartClose").addEventListener("click",closeChart);
$("chartReset").addEventListener("click",()=>{if(LW&&CHART_ROW&&CHART[CHART_ROW.key]){const n=CHART[CHART_ROW.key].dates.length;LW.timeScale().setVisibleLogicalRange({from:Math.max(0,n-120),to:n+5});}});
$("chartFit").addEventListener("click",()=>{if(LW){try{LW.timeScale().fitContent();}catch(_){} }});
$("chartFullscreen").addEventListener("click",()=>{const box=document.querySelector(".chart-box");if(!document.fullscreenElement){box?.requestFullscreen?.();}else{document.exitFullscreen?.();}});
function setChartWindow(days){if(!LW||!CHART_ROW||!CHART[CHART_ROW.key])return;const n=CHART[CHART_ROW.key].dates.length;LW.timeScale().setVisibleLogicalRange({from:Math.max(0,n-days),to:n+4});}
$("chart120").addEventListener("click",()=>setChartWindow(120));
$("chart60").addEventListener("click",()=>setChartWindow(60));
$("chart30").addEventListener("click",()=>setChartWindow(30));

$("chartModal").addEventListener("click",e=>{if(e.target.id==="chartModal") closeChart()});
document.addEventListener("keydown",e=>{if(e.key==="Escape" && $("chartModal").classList.contains("open")) closeChart()});

async function load(){
  try{
    const resp=await fetch("data/results.json?"+Date.now(),{cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    D=await resp.json();
    try { const cr=await fetch("data/chart_data.json?"+Date.now(),{cache:"no-store"}); CHART=cr.ok?await cr.json():{}; } catch (_) { CHART={}; }
    $("meta").textContent=`${D.asof||"—"} · ${Number(D.stats?.traded_last_day||0).toLocaleString("en-IN")} stocks traded · updated ${String(D.generated||"—").replace("T"," ")}`;
    const age=(Date.now()-new Date(D.asof))/864e5;
    if(Number.isFinite(age)&&age>4){$("stale").style.display="block";$("stale").textContent=`Data is ${Math.floor(age)} days old.`;}
    render();
    document.body.classList.add("ready");
  }catch(err){
    console.error(err);
    $("meta").textContent="Could not load data/results.json";
    $("foot").textContent="Make sure the local server is running from ~/stock-screener.";
    document.body.classList.add("ready");
  }
}

try{
  const th=localStorage.getItem("scn-theme");
  if(th) document.documentElement.dataset.theme=th;
}catch(_){}
wire();
load();
</script>
</body>
</html>
