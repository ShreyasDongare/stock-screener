<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolf Momentum Screener • Market Intelligence</title>
<link rel="icon" type="image/png" href="assets/wolf-logo.png?v=1"><link rel="apple-touch-icon" href="assets/wolf-logo.png?v=1"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#EEF1F4;--panel:#fff;--ink:#16212B;--mute:#68788A;--line:#DCE2E8;--hover:#F2F6FA;--up:#17794F;--dn:#B83232;--acc:#2A5A8E;--accbg:#E2ECF6;--warn:#B16A00;--hdr:#15212C;--hdrink:#fff;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1419;--panel:#171E26;--ink:#E5EAF0;--mute:#8797A8;--line:#27313C;--hover:#1D2630;--up:#3FBE8C;--dn:#E56C6C;--acc:#80B2E6;--accbg:#223347;--warn:#E2A446;--hdr:#0B0F13}}
:root[data-theme="dark"]{--bg:#0F1419;--panel:#171E26;--ink:#E5EAF0;--mute:#8797A8;--line:#27313C;--hover:#1D2630;--up:#3FBE8C;--dn:#E56C6C;--acc:#80B2E6;--accbg:#223347;--warn:#E2A446;--hdr:#0B0F13}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(circle at 12% -8%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 30%),radial-gradient(circle at 90% 18%,color-mix(in srgb,var(--up) 7%,transparent),transparent 24%),var(--bg);color:var(--ink);font:14px/1.45 var(--sans);min-height:100vh}
@keyframes smoothEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes softPulse{0%,100%{opacity:.72}50%{opacity:1}}
.top{background:linear-gradient(135deg,#101820,var(--hdr));color:var(--hdrink);box-shadow:0 8px 28px rgba(0,0,0,.16);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -10% -55% 35%;height:180px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 22%,transparent),transparent 68%);pointer-events:none}
.in{width:calc(100% - 40px);max-width:none;margin:0 auto;padding:21px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:0}
h1{font-size:25px;font-weight:600;margin:0;letter-spacing:-.45px}
.sub{color:#AEBBC8;font-size:12px;margin-top:5px;font-family:var(--mono);letter-spacing:.15px}
.status{display:flex;align-items:center;gap:8px;color:#C9D5E1;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.75px}
.status i{width:7px;height:7px;border-radius:50%;background:#45C98D;box-shadow:0 0 0 4px rgba(69,201,141,.12);animation:softPulse 2.4s ease-in-out infinite}
.ic{background:rgba(255,255,255,.05);border:1px solid #3A4856;color:var(--hdrink);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;transition:background .22s ease,transform .22s ease,border-color .22s ease}.ic:hover{background:rgba(255,255,255,.11);transform:translateY(-1px);border-color:#526273}
main{width:calc(100% - 40px);max-width:none;height:calc(100vh - 86px);margin:0 auto;padding:22px 0 20px;display:flex;flex-direction:column;overflow:hidden}
.stale{display:none;background:var(--accbg);border-left:4px solid var(--warn);padding:9px 12px;border-radius:4px;margin-bottom:12px}
.section-kicker{display:flex;justify-content:space-between;align-items:center;margin:0 2px 11px;color:var(--mute);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.8px}
.dashboard-grid{display:grid;grid-template-columns:225px minmax(0,1fr);gap:16px;align-items:stretch;min-height:0;flex:1;overflow:hidden}
.tabs{display:flex;flex-direction:column;gap:10px;margin:0;position:static;align-self:stretch;height:auto;min-height:0}
.tab{width:100%;min-height:92px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 98%,var(--acc)),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 17px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s cubic-bezier(.2,.7,.2,1),border-color .28s ease,background .28s ease}
.tab:hover{transform:translateX(2px);box-shadow:0 12px 26px rgba(0,0,0,.08);border-color:color-mix(in srgb,var(--acc) 42%,var(--line))}
.tab:active{transform:translateX(0)}
.tab b{display:block;font:500 29px/1.1 var(--mono);letter-spacing:-.5px}.tab span{color:var(--mute);font-size:12.5px}
.tab[aria-selected="true"]{border-color:color-mix(in srgb,var(--acc) 68%,var(--line));background:linear-gradient(180deg,var(--accbg),var(--panel));box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 11%,transparent)}
.copy-all{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:600 12px var(--sans);cursor:pointer;transition:.2s}.copy-all:hover{border-color:var(--acc);background:var(--accbg);transform:translateY(-1px)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:auto;right:0;top:15px;bottom:15px;width:2px;background:var(--acc);border-radius:2px;transform-origin:center;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(15,30,45,.065);overflow:hidden;animation:smoothEnter .38s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column;min-height:0}
.tools{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 95%,var(--bg))}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,select,input,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 11px;font:inherit}
.chip{border-radius:999px;cursor:pointer;transition:background .22s ease,border-color .22s ease,transform .22s ease,box-shadow .22s ease}.chip:hover{transform:translateY(-1px);border-color:var(--acc)}.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--panel);box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 18%,transparent)}
.btn{cursor:pointer;background:var(--acc);border-color:var(--acc);color:var(--panel);font-weight:500;min-width:96px;transition:background .22s ease,transform .22s ease,box-shadow .22s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 22%,transparent)}.btn:active{transform:translateY(0)}
label{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center}
input[type=search]{width:190px}.sp{margin-left:auto}
.desc{margin:0;padding:9px 12px;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.wrap{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mute) 42%,transparent) transparent;scrollbar-gutter:stable}
.wrap::-webkit-scrollbar{width:8px;height:8px}
.wrap::-webkit-scrollbar-track{background:transparent;margin:8px 0}
.wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 62%,var(--mute)),color-mix(in srgb,var(--acc) 42%,var(--mute)));border:2px solid transparent;background-clip:padding-box;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--panel) 18%,transparent);min-height:44px}
.wrap::-webkit-scrollbar-thumb:hover{background:var(--acc);border:1px solid transparent;background-clip:padding-box;box-shadow:0 0 10px color-mix(in srgb,var(--acc) 28%,transparent)}
.wrap::-webkit-scrollbar-thumb:active{background:var(--acc)}
.wrap::-webkit-scrollbar-corner{background:transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-size:13px}
td.l,th.l{text-align:left;font-family:var(--sans)}
thead th{position:sticky;top:0;z-index:2;background:var(--panel);padding:0;color:var(--mute);font:500 12px var(--sans);border-bottom:2px solid var(--line)}
th button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:9px 10px;text-align:right}
th:has(button[data-sort="adx"]),td:has(.adx-cell){min-width:64px}
th.l button{text-align:left}th button:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{position:sticky;left:0;background:var(--panel)}
thead th:first-child{z-index:3}
tbody tr{transition:background .2s ease,transform .2s ease}tbody tr:hover td{background:var(--hover)}
.sym a{color:var(--ink);font-weight:600;text-decoration:none;font-family:var(--sans)}.sym a:hover{color:var(--acc);text-decoration:underline}
.ex{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.up{color:var(--up)}.dn{color:var(--dn)}.w{color:var(--warn);cursor:help}
.tag{font:500 12px var(--sans);padding:2px 9px;border-radius:4px;background:var(--accbg);color:var(--acc)}.tag.t{background:transparent;border:1px solid var(--up);color:var(--up)}
.rs{display:inline-flex;align-items:center;gap:7px}.rs i{display:block;height:5px;border-radius:3px;background:var(--acc);width:0;opacity:.8}.rs b{font-weight:500;min-width:20px}
.rk-ok{color:var(--up)}.rk-mid{color:var(--warn)}.rk-hi{color:var(--dn)}
.empty{padding:34px;text-align:center;color:var(--mute);font-family:var(--sans)}
.foot{padding:8px 12px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:1000px){.dashboard-grid{grid-template-columns:205px minmax(0,1fr);gap:12px}.wrap{overflow:auto;scrollbar-width:thin}table{min-width:860px}}
@media(max-width:720px){html,body{height:auto;overflow:auto}.in,main{width:calc(100% - 24px)}main{height:auto;overflow:visible;padding-bottom:28px}.dashboard-grid{grid-template-columns:1fr;overflow:visible}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;position:static}.tab{min-height:78px}.panel{min-height:520px}.wrap{overflow:auto;max-height:60vh}.section-kicker{font-size:9.5px}}
@media(max-width:420px){.in,main{width:calc(100% - 18px)}.tabs{grid-template-columns:1fr}.tab b{font-size:20px}.tab span{font-size:11.5px}.sp{margin-left:0}input[type=search]{width:100%}}
/* In-dashboard interactive EOD chart */
.chart-link{all:unset;cursor:pointer;color:var(--ink);font-weight:600;font-family:var(--sans)}
.chart-link:hover{color:var(--acc);text-decoration:underline}
.chart-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(5,12,20,.62);backdrop-filter:blur(6px)}
.chart-modal.open{display:flex}
.chart-box{width:min(1720px,99vw);height:min(900px,96vh);background:#0d131a;border:1px solid #293542;border-radius:14px;box-shadow:0 28px 100px rgba(0,0,0,.48);display:flex;flex-direction:column;overflow:hidden}
.chart-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#101820;border-bottom:1px solid #293542;min-height:58px}
.chart-title{font:700 17px var(--sans);color:#E8EEF5;letter-spacing:-.2px}.chart-cross-ohlc{position:absolute;right:86px;bottom:10px;z-index:6;display:flex;gap:10px;align-items:center;padding:6px 9px;border:1px solid #2D3D4C;border-radius:6px;background:rgba(13,19,26,.9);backdrop-filter:blur(5px);font:500 10px var(--mono);white-space:nowrap;pointer-events:none}.chart-cross-ohlc span{color:#8191A1}.chart-cross-ohlc b{color:#E8EEF5;font-weight:500}
.chart-meta{color:#8191A1;font:11px var(--mono);margin-left:2px}
.chart-close{margin-left:auto;border:1px solid #344352;background:#151E27;color:#B9C6D3;border-radius:7px;padding:6px 10px;cursor:pointer}.chart-close:hover{background:#202B36;color:#fff}
.chart-body{position:relative;flex:1;min-height:0;padding:0;display:flex}.chart-watchlist{width:250px;flex:0 0 250px;background:#101820;border-right:1px solid #293542;padding:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chart-watch-head{flex:0 0 auto;background:#101820;padding:4px 0 5px;border-bottom:1px solid #1F2B36}
.chart-watch-title{color:#8191A1;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.7px;padding:2px 7px 6px;background:#101820}
.chart-watch-search{position:relative;z-index:1;width:100%;box-sizing:border-box;margin:0 0 5px;padding:7px 8px;border:1px solid #2D3D4C;border-radius:7px;background:#0D151D;color:#DDE6EF;outline:none;font:10px var(--mono);transition:border-color .2s,box-shadow .2s,transform .2s}
.chart-watch-search::placeholder{color:#607384}
.chart-watch-search:focus{border-color:#4D87C2;box-shadow:0 0 0 2px rgba(77,135,194,.12);transform:translateY(-1px)}
.chart-watch-columns{display:grid;grid-template-columns:minmax(0,1fr) 72px 58px;gap:4px;align-items:center;padding:2px 7px 4px;color:#66798C;font:600 8px var(--mono);text-transform:uppercase;letter-spacing:.35px}
.chart-watch-columns button{all:unset;box-sizing:border-box;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-watch-columns button:not(:first-child){text-align:right}
.chart-watch-columns button:hover{color:#B9C6D3}
.chart-watch-columns button.active{color:#8FB9DF}
.chart-watch-scroll{position:relative;flex:1 1 0;min-height:0;height:0;overflow-y:scroll;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#34495A transparent;overscroll-behavior:contain}
.chart-watch-scroll::-webkit-scrollbar{width:7px}
.chart-watch-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.025)}
.chart-watch-scroll::-webkit-scrollbar-thumb{background:#34495A;border-radius:999px;border:1px solid transparent;background-clip:padding-box}
.chart-watch-scroll::-webkit-scrollbar-thumb:hover{background:#4D87C2}
.chart-watch-spacer{position:relative;width:100%}
.chart-watch-items{position:absolute;left:0;right:0;top:0;display:block;padding:0}
.chart-watch-item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 72px 58px;gap:4px;align-items:center;width:100%;height:44px;padding:5px 7px;margin:0;border:1px solid transparent;border-radius:6px;background:transparent;color:#B9C6D3;text-align:left;font:500 10px var(--mono);cursor:pointer;transition:background .12s,border-color .12s,transform .12s}
.chart-watch-item:hover{background:#182430;border-color:#2D4254}
.chart-watch-item.active{background:#20354A;border-color:#4D87C2;color:#fff;box-shadow:inset 2px 0 0 #58A6E6}
.chart-watch-item>span{min-width:0;white-space:nowrap}
.chart-watch-item>span:not(:first-child){text-align:right}
.chart-watch-item .wsymbol{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;overflow:visible}
.chart-watch-item .wsymbol>b{display:block;white-space:nowrap;overflow:visible;color:inherit;font-weight:600}
.chart-watch-item .wexch{display:inline-block;padding:1px 4px;border-radius:3px;font:600 7px var(--mono);line-height:1.15;letter-spacing:.4px}
.chart-watch-item .wexch.nse{color:#58A6E6;background:rgba(88,166,230,.10);border:1px solid rgba(88,166,230,.30)}
.chart-watch-item .wexch.bse{color:#E56C6C;background:rgba(229,108,108,.10);border:1px solid rgba(229,108,108,.30)}
.chart-watch-item .wprice,.chart-watch-item .wchg{font-size:9px}
.chart-watch-item .wprice{color:#8EA0B2}
.chart-watch-item.active .wprice{color:#C7D8E8}
.chart-watch-item .wchg.up{color:#45C98D}
.chart-watch-item .wchg.dn{color:#E56C6C}
.chart-watch-item.tag-red{background:rgba(217,83,83,.13);border-color:rgba(217,83,83,.38)}
.chart-watch-item.tag-orange{background:rgba(230,151,61,.13);border-color:rgba(230,151,61,.38)}
.chart-watch-item.tag-yellow{background:rgba(231,184,75,.13);border-color:rgba(231,184,75,.38)}
.chart-watch-item.tag-green{background:rgba(69,201,141,.13);border-color:rgba(69,201,141,.38)}
.chart-watch-item.tag-blue{background:rgba(88,166,230,.13);border-color:rgba(88,166,230,.38)}
.chart-watch-item.tag-purple{background:rgba(177,125,230,.13);border-color:rgba(177,125,230,.38)}
.chart-watch-help{flex:0 0 auto;color:#607384;font:9px var(--mono);padding:4px 7px 2px;line-height:1.5;background:#101820}
.chart-tag-palette{position:fixed;z-index:100;display:flex;gap:7px;padding:8px;background:#111A22;border:1px solid #344352;border-radius:9px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.chart-tag-choice{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.12);cursor:pointer;background:#344352;position:relative}
.chart-tag-choice:hover{transform:scale(1.08);border-color:#8EA4B8}
.chart-tag-choice.none{background:linear-gradient(135deg,transparent 44%,#D95353 45%,#D95353 55%,transparent 56%),#1A2530}.chart-tag-choice.red{background:#D95353}.chart-tag-choice.orange{background:#E6973D}.chart-tag-choice.yellow{background:#E7B84B}.chart-tag-choice.green{background:#45C98D}.chart-tag-choice.blue{background:#58A6E6}.chart-tag-choice.purple{background:#B17DE6}
.chart-tag-choice::after{content:attr(aria-label);position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);display:none;padding:3px 6px;border-radius:4px;background:#0B1117;color:#DDE6EF;font:9px var(--mono);white-space:nowrap;pointer-events:none}
.chart-tag-choice:hover::after{display:block}
.chart-host{position:relative;flex:1;min-width:0;inset:auto;background:#0D131A}
:root[data-theme="light"] .chart-watchlist{background:#F7F9FB;border-color:#DCE2E8}:root[data-theme="light"] .chart-host{background:#FFFFFF}
:root[data-theme="light"] .chart-watch-head,:root[data-theme="light"] .chart-watch-title,:root[data-theme="light"] .chart-watch-help{background:#F7F9FB}
:root[data-theme="light"] .chart-watch-head{border-color:#E1E6EB}
:root[data-theme="light"] .chart-watch-title{color:#68788A}
:root[data-theme="light"] .chart-watch-columns{color:#81909E}
:root[data-theme="light"] .chart-watch-columns button:hover{color:#526273}
:root[data-theme="light"] .chart-watch-columns button.active{color:#2A5A8E}
:root[data-theme="light"] .chart-watch-scroll{scrollbar-color:#B8C5D1 transparent}
:root[data-theme="light"] .chart-watch-scroll::-webkit-scrollbar-track{background:rgba(0,0,0,.03)}
:root[data-theme="light"] .chart-watch-scroll::-webkit-scrollbar-thumb{background:#B8C5D1}
:root[data-theme="light"] .chart-watch-search{border-color:#D0D8E0;background:#fff;color:#263746}
:root[data-theme="light"] .chart-watch-search::placeholder{color:#8A99A8}
:root[data-theme="light"] .chart-watch-search:focus{border-color:#2A5A8E;box-shadow:0 0 0 2px rgba(42,90,142,.12)}
:root[data-theme="light"] .chart-watch-item{color:#4D5D6D}
:root[data-theme="light"] .chart-watch-item:hover{background:#EEF3F7;border-color:#D0DCE7}
:root[data-theme="light"] .chart-watch-item.active{background:#E2ECF6;border-color:#6B98C2;color:#16212B}
:root[data-theme="light"] .chart-watch-item .wprice{color:#657789}
:root[data-theme="light"] .chart-watch-item.active .wprice{color:#4E6B85}
.chart-tooltip{position:absolute;z-index:4;pointer-events:none;display:none;min-width:190px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(4px);font:11px/1.45 var(--mono);color:var(--ink)}
.chart-tooltip .tt-date{font-weight:600;margin-bottom:4px}.chart-tooltip .tt-grid{display:grid;grid-template-columns:auto auto;gap:2px 12px}
.chart-controls{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid #293542;background:#101820}
.chart-controls button{border:1px solid #344352;background:#151E27;color:#93A3B3;border-radius:6px;padding:5px 11px;font:500 11px var(--sans);cursor:pointer}.chart-controls button:hover,.chart-controls button.active{color:#fff;border-color:#4D87C2;background:#20354A}
.chart-controls .hint{margin-left:auto;color:var(--mute);font:11px var(--mono)}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:7px 14px;color:#8191A1;background:#0D131A;font:11px var(--sans);border-top:1px solid #293542}
.chart-legend b{color:#DDE6EF}
.chart-toolrow{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid #293542;background:#0F171F;overflow-x:auto;scrollbar-width:none}
.chart-toolrow::-webkit-scrollbar{display:none}

<script>
const SCANS = {
  stage2: {
    t: "Strong Stage 2",
    d: "Trend template plus relative strength. A watchlist, not an entry signal.",
    sort: ["rs", -1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["close","Close"],["chg","Chg %"],["rs","RS"],["adx","ADX"],["ret1m","1M %"],["ret3m","3M %"],["ret6m","6M %"],["off_high","Off high %"],["adr","ADR %"],["spark","40 days"]]
  },
  pullback: {
    t: "Pullback",
    d: "Close within the set % of EMA 11, EMA 21 or SMA 50. Entry above today's high, stop at the 5-day low.",
    sort: ["dist", 1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["close","Close"],["chg","Chg %"],["adx","ADX"],["level","Level","l"],["dist","Dist %"],["ret1m","1M %"],["ret3m","3M %"],["ret6m","6M %"],["entry","Entry"],["stop","Stop"],["risk","Risk %"],["spark","40 days"]]
  },
  breakout_htf: {
    t: "Breakout / HTF",
    d: "Combined view of tight-flag Breakout and High Tight Flag candidates.",
    sort: ["gain", -1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["setup","Setup","l"],["state","State","l"],["close","Close"],["adx","ADX"],["gain","Run-up %"],["flag_days","Flag days"],["depth","Dip %"],["entry","Entry"],["stop","Stop"],["risk","Risk %"],["spark","40 days"]]
  },
  ep: {
    t: "Episodic Pivot",
    d: "Gap-up on heavy volume after a quiet stretch. Entry above the EP-day high, stop at its low.",
    sort: ["vol_ratio", -1],
    cols: [["symbol","Symbol","l"],["exch","Exch","l"],["state","State","l"],["close","Close"],["adx","ADX"],["gap","Gap %"],["vol_ratio","Vol x"],["prior_3m","Prior 3M %"],["adr","ADR %"],["entry","Entry"],["stop","Stop"],["risk","Risk %"],["spark","40 days"]]
  }
};

const DEFAULT_STATE = { tab: "stage2", ex: "ALL", q: "", rs: 70, off: "", lv: {EMA11:true,EMA21:true,SMA50:true}, risk:"", st:"", key:"rs", dir:-1 };
let S = {...DEFAULT_STATE};
try {
  const saved = JSON.parse(localStorage.getItem("scn") || "{}");
  S = {...DEFAULT_STATE, ...saved, lv:{...DEFAULT_STATE.lv, ...(saved.lv||{})}};
  if (!SCANS[S.tab]) S.tab = "stage2";
} catch (_) {}

const $ = id => document.getElementById(id);
const f2 = x => x == null || !Number.isFinite(Number(x)) ? "" : Number(x).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc = x => String(x ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
let D = null, SHOWN = [];

function sourceRows(tab){
  if (!D || !D.scans) return [];
  if (tab === "breakout_htf") {
    const bo = (D.scans.breakout || []).map(r => ({...r, setup:"Breakout", gain:r.runup ?? 0, depth:r.depth ?? null}));
    const hf = (D.scans.htf || []).map(r => ({...r, setup:"HTF", gain:r.gain ?? 0, depth:r.pullback ?? null}));
    return bo.concat(hf);
  }
  return D.scans[tab] || [];
}

function rows(tab){
  const q = S.q.trim().toUpperCase();
  return sourceRows(tab).filter(r => {
    if (S.ex !== "ALL" && r.exch !== S.ex) return false;
    if (q && !String(r.symbol || "").toUpperCase().includes(q)) return false;
    if (tab === "stage2") return Number(r.rs || 0) >= Number(S.rs) && (S.off === "" || Number(r.off_high) <= Number(S.off));
    if (tab === "pullback") return !!S.lv[r.level] && (S.risk === "" || Number(r.risk) <= Number(S.risk));
    return (S.st === "" || r.state === S.st) && (S.risk === "" || Number(r.risk) <= Number(S.risk));
  });
}

function valueFor(r,key){
  if(key === "dist") return Math.abs(Number(r.dist || 0));
  if(key === "gain") return Number(r.gain || 0);
  return r[key];
}

function spark(a, up){
  if(!Array.isArray(a) || a.length < 2) return "";
  const vals = a.map(Number).filter(Number.isFinite);
  if(vals.length < 2) return "";
  const mn=Math.min(...vals), mx=Math.max(...vals), den=mx-mn || 1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1)*92+2).toFixed(1),(26-(v-mn)/den*22).toFixed(1)]);
  const col = `var(${up ? "--up" : "--dn"})`;
  const last=pts[pts.length-1];
  return `<svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.3" fill="${col}"/></svg>`;
}

function heat(v){
  if(v == null || !Number.isFinite(Number(v))) return "<td></td>";
  const n=Number(v), cls=n>=0?"up":"dn";
  return `<td class="${cls}">${n>=0?"+":""}${f2(n)}</td>`;
}

const CELL = {
  symbol:r=>`<td class="sym l"><button class="chart-link" data-chart-key="${esc(r.key)}" title="Click for EOD chart · Double-click for Dhan TradingView">${esc(r.symbol)}</button>${r.note ? ` <span class="w" title="${esc(r.note)}">⚠</span>` : ""}</td>`,
  exch:r=>`<td class="l"><span class="ex">${esc(r.exch)}</span></td>`,
  setup:r=>`<td class="l"><span class="tag">${esc(r.setup)}</span></td>`,
  state:r=>`<td class="l"><span class="tag ${r.state==="Triggered"?"t":""}">${esc(r.state)}</span></td>`,
  chg:r=>`<td class="${Number(r.chg)>=0?"up":"dn"}">${Number(r.chg)>=0?"+":""}${f2(r.chg)}</td>`,
  rs:r=>`<td><span class="rs"><i style="width:${Math.min(40,Number(r.rs||0)*.4)}px"></i><b>${f2(r.rs)}</b></span></td>`,
  adx:r=>`<td class="adx-cell">${f2(r.adx)}</td>`,
  ret1m:r=>heat(r.ret1m), ret3m:r=>heat(r.ret3m), ret6m:r=>heat(r.ret6m),
  dist:r=>`<td>${Number(r.dist)>=0?"+":""}${f2(r.dist)}</td>`,
  risk:r=>`<td class="${Number(r.risk)<=5?"rk-ok":Number(r.risk)<=10?"rk-mid":"rk-hi"}">${f2(r.risk)}</td>`,
  level:r=>`<td class="l">${esc(r.level)}</td>`,
  spark:r=>`<td>${spark(r.spark,Number(r.chg)>=0)}</td>`
};

function options(values,current,label){
  return values.map(v=>`<option value="${esc(v)}" ${String(v)===String(current)?"selected":""}>${label(v)}</option>`).join("");
}

let LW = null;
let CHART = null, CHART_ROW = null;
let chartClickTimer = null;
let CHART_SERIES = {};
let CHART_TF = "D";

function weeklyChartData(src){
  const out={dates:[],open:[],high:[],low:[],close:[],volume:[]};
  let cur=null;
  for(let i=0;i<src.dates.length;i++){
    const date=String(src.dates[i]);
    const dt=new Date(date+"T00:00:00Z");
    const day=dt.getUTCDay();
    const monday=new Date(dt);
    const diff=day===0?-6:1-day;
    monday.setUTCDate(dt.getUTCDate()+diff);
    const week=monday.toISOString().slice(0,10);
    if(week!==cur){
      cur=week;
      out.dates.push(week);
      out.open.push(Number(src.open[i]));
      out.high.push(Number(src.high[i]));
      out.low.push(Number(src.low[i]));
      out.close.push(Number(src.close[i]));
      out.volume.push(Number(src.volume[i])||0);
    }else{
      const j=out.close.length-1;
      out.high[j]=Math.max(out.high[j],Number(src.high[i]));
      out.low[j]=Math.min(out.low[j],Number(src.low[i]));
      out.close[j]=Number(src.close[i]);
      out.volume[j]+=(Number(src.volume[i])||0);
    }
  }
  const close=out.close;
  const ema=(span)=>{
    const a=2/(span+1), z=[]; let prev=close[0];
    for(const x of close){prev=a*x+(1-a)*prev;z.push(Number(prev.toFixed(4)));}
    return z;
  };
  const sma=(n)=>close.map((_,i)=>i>=n-1?Number((close.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n).toFixed(4)):null);
  out.ema11=ema(11); out.ema21=ema(21); out.sma50=sma(50);
  return {...src,...out};
}

function chartDataForTimeframe(src){
  return CHART_TF==="W" ? weeklyChartData(src) : src;
}
function closeChart(){
  $("chartModal").classList.remove("open");
  if(LW){ try{LW.remove();}catch(_){} LW=null; }
  CHART_ROW=null;
  $("chartBody").innerHTML="";
}
const CHART_TAGS_KEY="scn-chart-tags";
function getTags(){
  try{
    const v=JSON.parse(localStorage.getItem(CHART_TAGS_KEY)||"{}");
    return v && typeof v==="object" ? v : {};
  }catch(_){ return {}; }
}
function saveTags(tags){
  try{ localStorage.setItem(CHART_TAGS_KEY,JSON.stringify(tags||{})); }catch(_){}
}

const CHART_WATCH_ROW_HEIGHT=44;
const CHART_WATCH_BUFFER=12;
let CHART_WATCH_Q="";
let CHART_WATCH_SCROLL_TOP=null;
let CHART_WATCH_SORT="chg";
let CHART_WATCH_SORT_DIR=-1;
let CHART_WATCH_ITEMS=[];
let CHART_WATCH_ACTIVE_KEY="";
let CHART_WATCH_TAGS={};
let CHART_WATCH_VIRTUAL={start:0,end:0,raf:0};

function chartRowKey(r){
  return r?.key||((String(r?.exch||"NSE").toUpperCase())+":"+String(r?.symbol||""));
}
function chartRows(){
  const all=Object.values(D?.scans||{}).flat().filter(r=>r&&r.symbol);
  const seen=new Set();
  return all.filter(r=>{
    const k=chartRowKey(r);
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
function chartWatchItems(){
  const all=chartRows(), q=CHART_WATCH_Q.trim().toUpperCase();
  const items=all.filter(r=>!q||String(r.symbol||"").toUpperCase().includes(q));

  const sortValue=(r,key)=>{
    if(key==="symbol") return String(r.symbol||"").toUpperCase();
    if(key==="price") return Number(r.close);
    return Number(r.chg);
  };
  const dir=CHART_WATCH_SORT_DIR;
  items.sort((a,b)=>{
    const av=sortValue(a,CHART_WATCH_SORT), bv=sortValue(b,CHART_WATCH_SORT);
    if(typeof av==="string" || typeof bv==="string") return dir*String(av).localeCompare(String(bv));
    const an=Number(av), bn=Number(bv);
    if(!Number.isFinite(an) && !Number.isFinite(bn)) return String(a.symbol).localeCompare(String(b.symbol));
    if(!Number.isFinite(an)) return 1;
    if(!Number.isFinite(bn)) return -1;
    const diff=dir*(an-bn);
    return diff!==0 ? diff : String(a.symbol||"").localeCompare(String(b.symbol||""));
  });
  return items;
}

function chartWatchRowHTML(r,activeKey){
  const key=chartRowKey(r);
  const price=Number(r.close), chg=Number(r.chg);
  const priceText=Number.isFinite(price)?f2(price):"—";
  const chgText=Number.isFinite(chg)?((chg>=0?"+":"")+f2(chg)+"%"):"—";
  const chgCls=Number.isFinite(chg)?(chg>=0?"up":"dn"):"";
  const tag=(CHART_WATCH_TAGS||{})[key]||"";
  return '<button class="chart-watch-item '+(key===activeKey?"active ":"")+(tag?"tag-"+esc(tag):"")+'" data-watch-key="'+esc(key)+'">'+
    '<span class="wsymbol"><b>'+esc(r.symbol)+'</b><span class="wexch '+(String(r.exch||"").toUpperCase()==="BSE"?"bse":"nse")+'">'+esc(String(r.exch||"NSE").toUpperCase())+'</span></span>'+
    '<span class="wprice">'+priceText+'</span>'+
    '<span class="wchg '+chgCls+'">'+chgText+'</span>'+
  '</button>';
}

function updateChartWatchVirtual(force=false){
  const scroll=$("chartWatchScroll"), spacer=$("chartWatchSpacer"), itemsEl=$("chartWatchItems");
  if(!scroll||!spacer||!itemsEl) return;

  const items=CHART_WATCH_ITEMS;
  const total=items.length;
  spacer.style.height=(total*CHART_WATCH_ROW_HEIGHT)+"px";

  const top=scroll.scrollTop;
  const viewport=Math.max(1,scroll.clientHeight);
  let start=Math.floor(top/CHART_WATCH_ROW_HEIGHT)-CHART_WATCH_BUFFER;
  start=Math.max(0,Math.min(start,total));
  let end=Math.ceil((top+viewport)/CHART_WATCH_ROW_HEIGHT)+CHART_WATCH_BUFFER;
  end=Math.max(start,Math.min(end,total));

  if(!force && start===CHART_WATCH_VIRTUAL.start && end===CHART_WATCH_VIRTUAL.end) return;
  CHART_WATCH_VIRTUAL.start=start;
  CHART_WATCH_VIRTUAL.end=end;
  itemsEl.style.transform="translateY("+(start*CHART_WATCH_ROW_HEIGHT)+"px)";
  itemsEl.innerHTML=items.slice(start,end).map(r=>chartWatchRowHTML(r,CHART_WATCH_ACTIVE_KEY)).join("");
}

function scheduleChartWatchVirtual(){
  if(CHART_WATCH_VIRTUAL.raf) return;
  CHART_WATCH_VIRTUAL.raf=requestAnimationFrame(()=>{
    CHART_WATCH_VIRTUAL.raf=0;
    updateChartWatchVirtual(false);
  });
}

function ensureChartWatchActiveVisible(){
  const scroll=$("chartWatchScroll");
  if(!scroll||!CHART_WATCH_ITEMS.length||!CHART_WATCH_ACTIVE_KEY) return;
  const index=CHART_WATCH_ITEMS.findIndex(r=>chartRowKey(r)===CHART_WATCH_ACTIVE_KEY);
  if(index<0) return;

  const top=index*CHART_WATCH_ROW_HEIGHT;
  const bottom=top+CHART_WATCH_ROW_HEIGHT;
  const viewTop=scroll.scrollTop;
  const viewBottom=viewTop+scroll.clientHeight;

  if(top < viewTop) scroll.scrollTop=Math.max(0,top-8);
  else if(bottom > viewBottom) scroll.scrollTop=Math.max(0,bottom-scroll.clientHeight+8);
}

function renderChartWatchlist(activeKey){
  const el=$("chartWatchlist"); if(!el) return;
  CHART_WATCH_ACTIVE_KEY=activeKey||"";
  CHART_WATCH_TAGS=getTags();
  CHART_WATCH_ITEMS=chartWatchItems();
  CHART_WATCH_VIRTUAL={start:0,end:0,raf:0};

  const previousScrollTop=CHART_WATCH_SCROLL_TOP;
  CHART_WATCH_SCROLL_TOP=null;

  const sortMark=(key)=>CHART_WATCH_SORT===key?(CHART_WATCH_SORT_DIR>0?" ▲":" ▼"):"";
  el.innerHTML=
    '<div class="chart-watch-head">'+
      '<div class="chart-watch-title">Scanned Stocks</div>'+
      '<input id="chartWatchSearch" class="chart-watch-search" placeholder="Search symbol..." value="'+esc(CHART_WATCH_Q)+'">'+
      '<div class="chart-watch-columns">'+
        '<button type="button" data-watch-sort="symbol" class="'+(CHART_WATCH_SORT==="symbol"?"active":"")+'">Stock'+sortMark("symbol")+'</button>'+
        '<button type="button" data-watch-sort="price" class="'+(CHART_WATCH_SORT==="price"?"active":"")+'">Price (₹)'+sortMark("price")+'</button>'+
        '<button type="button" data-watch-sort="chg" class="'+(CHART_WATCH_SORT==="chg"?"active":"")+'">Change %'+sortMark("chg")+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="chart-watch-scroll" id="chartWatchScroll">'+
      '<div class="chart-watch-spacer" id="chartWatchSpacer">'+
        '<div class="chart-watch-items" id="chartWatchItems"></div>'+
      '</div>'+
    '</div>'+
    '<div class="chart-watch-help">Click = EOD chart · Double-click = TradingView</div>';

  updateChartWatchVirtual(true);

  // Some browsers report a zero-height flex child for one frame while the
  // chart modal is opening. Recalculate after layout so rows cannot remain
  // invisible.
  requestAnimationFrame(()=>updateChartWatchVirtual(true));

  const scroll=$("chartWatchScroll");
  if(scroll){
    scroll.scrollTop=Math.max(0,Number(previousScrollTop)||0);
    updateChartWatchVirtual(true);
    requestAnimationFrame(()=>{
      ensureChartWatchActiveVisible();
      updateChartWatchVirtual(true);
    });
    scroll.addEventListener("scroll",scheduleChartWatchVirtual,{passive:true});
  }

  const search=$("chartWatchSearch");
  if(search) search.addEventListener("input",e=>{
    CHART_WATCH_Q=e.target.value;
    const keepActive=CHART_WATCH_ACTIVE_KEY;
    CHART_WATCH_SCROLL_TOP=0;
    renderChartWatchlist(keepActive);
    const s=$("chartWatchSearch"); s?.focus();
    s?.setSelectionRange(CHART_WATCH_Q.length,CHART_WATCH_Q.length);
  });
}

function bindChartTooltip(chart,d,candle,ema11,ema21,sma50,volume){
  const host=$("chartHost");
  chart.subscribeCrosshairMove(p=>{
    const bar=$("chartCrossOhlc");
    if(!p || !p.point || p.point.x<0 || p.point.y<0 || p.point.x>host.clientWidth || p.point.y>host.clientHeight || !p.time){
      if(bar) bar.innerHTML="";
      return;
    }
    const cd=p.seriesData.get(candle);
    if(!cd){if(bar) bar.innerHTML="";return;}
    const fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("en-IN",{maximumFractionDigits:2}):"—";
    if(bar) bar.innerHTML='<span>O <b>'+fmt(cd.open)+'</b></span><span>H <b>'+fmt(cd.high)+'</b></span><span>L <b>'+fmt(cd.low)+'</b></span><span>C <b>'+fmt(cd.close)+'</b></span>';
  });
}

function openChart(key,row){
  if(!CHART || !CHART[key] || typeof LightweightCharts==="undefined") return;
  const baseD=CHART[key], d=chartDataForTimeframe(baseD), n=d.dates.length;
  const dark=document.documentElement.dataset.theme==="dark";
  const ct=dark ? {
    bg:"#0D131A", text:"#91A2B3", grid:"rgba(125,145,165,.075)", border:"#293542",
    cross:"#71869B", crossLabel:"#33485B", up:"#20A46B", down:"#D95353",
    ema11:"rgba(88,166,230,.62)", ema21:"rgba(231,184,75,.62)", sma50:"rgba(177,125,230,.52)", volume:"#3E5368"
  } : {
    bg:"#FFFFFF", text:"#526273", grid:"rgba(82,98,115,.10)", border:"#DCE2E8",
    cross:"#7A8C9D", crossLabel:"#526273", up:"#17794F", down:"#B83232",
    ema11:"rgba(42,120,184,.62)", ema21:"rgba(176,122,0,.62)", sma50:"rgba(123,79,163,.52)", volume:"#8A9AAA"
  };
  CHART_ROW=row||null;
  const last=n-1, close=Number(d.close[last]), prev=n>1?Number(d.close[last-1]):NaN;
  const dayPct=Number.isFinite(prev)&&prev!==0?(close/prev-1)*100:NaN;
  const fmt=x=>Number.isFinite(x)?x.toLocaleString("en-IN",{maximumFractionDigits:2}):"—";

  $("chartTitle").textContent=d.exch+":"+d.symbol;
  $("chartMeta").textContent=d.dates[0]+" → "+d.dates[last]+" · "+n+" "+(CHART_TF==="W"?"weeks":"sessions")+" · "+(CHART_TF==="W"?"Weekly":"EOD");
  document.querySelectorAll("[data-chart-tf]").forEach(b=>b.classList.toggle("active",b.dataset.chartTf===CHART_TF));
  $("chartStats").innerHTML=
    '<span style="color:'+ct.text+'">₹'+fmt(close)+'</span>'+
    '<span style="color:'+(dayPct>=0?ct.up:ct.down)+'">'+(dayPct>=0?'+':'')+fmt(dayPct)+'%</span>'+
    (Number.isFinite(row?.adx)?'<span style="color:'+ct.text+'">ADX '+fmt(Number(row.adx))+'</span>':'')+
    (row?.setup?'<span style="color:'+ct.ema11+'">'+esc(row.setup)+'</span>':'')+
    '';

  // Save the existing watchlist position before rebuilding chartBody. This is the
  // important part: openChart() replaces the DOM, so reading scrollTop after that
  // replacement would always return 0 and make the list jump to the top.
  const oldWatchlist=$("chartWatchScroll");
  CHART_WATCH_SCROLL_TOP=oldWatchlist ? oldWatchlist.scrollTop : null;
  $("chartBody").innerHTML='<aside class="chart-watchlist" id="chartWatchlist"></aside><div class="chart-host" id="chartHost"><div class="chart-cross-ohlc" id="chartCrossOhlc" aria-live="polite"></div></div>';
  $("chartModal").classList.add("open");
  renderChartWatchlist(key);
  const host=$("chartHost");

  const chart=LightweightCharts.createChart(host,{
    width:host.clientWidth,height:host.clientHeight,
    layout:{background:{type:LightweightCharts.ColorType.Solid,color:ct.bg},textColor:ct.text,fontFamily:"IBM Plex Mono, monospace",fontSize:11},
    grid:{vertLines:{color:ct.grid},horzLines:{color:ct.grid}},
    rightPriceScale:{borderColor:ct.border,scaleMargins:{top:.06,bottom:.24},minimumWidth:74},
    timeScale:{borderColor:ct.border,timeVisible:false,secondsVisible:false,rightOffset:6,barSpacing:8,minBarSpacing:2},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:ct.cross,width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:ct.crossLabel},horzLine:{color:ct.cross,width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:ct.crossLabel}},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:{time:true,price:true},axisDoubleClickReset:true},
    localization:{priceFormatter:p=>Number(p).toLocaleString("en-IN",{maximumFractionDigits:2})}
  });
  LW=chart;

  const candles=d.dates.map((time,i)=>({time,open:+d.open[i],high:+d.high[i],low:+d.low[i],close:+d.close[i]})).filter(x=>[x.open,x.high,x.low,x.close].every(Number.isFinite));
  const candle=chart.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:ct.up,downColor:ct.down,borderUpColor:ct.up,borderDownColor:ct.down,wickUpColor:ct.up,wickDownColor:ct.down,
    priceLineVisible:false,lastValueVisible:true
  });
  candle.setData(candles);

  const ema11=chart.addSeries(LightweightCharts.LineSeries,{color:ct.ema11,lineWidth:1,lastValueVisible:false,priceLineVisible:false});
  const ema21=chart.addSeries(LightweightCharts.LineSeries,{color:ct.ema21,lineWidth:1,lastValueVisible:false,priceLineVisible:false});
  const sma50=chart.addSeries(LightweightCharts.LineSeries,{color:ct.sma50,lineWidth:1,lastValueVisible:false,priceLineVisible:false});
  ema11.setData(d.dates.map((time,i)=>({time,value:+d.ema11[i]})).filter(x=>Number.isFinite(x.value)));
  ema21.setData(d.dates.map((time,i)=>({time,value:+d.ema21[i]})).filter(x=>Number.isFinite(x.value)));
  sma50.setData(d.dates.map((time,i)=>({time,value:+d.sma50[i]})).filter(x=>Number.isFinite(x.value) && x.value>0));

  const volume=chart.addSeries(LightweightCharts.HistogramSeries,{
    priceFormat:{type:"volume"},priceScaleId:"volume",lastValueVisible:false,priceLineVisible:false,
    color:ct.volume
  });
  volume.priceScale().applyOptions({scaleMargins:{top:.83,bottom:0},borderVisible:false});
  volume.setData(d.dates.map((time,i)=>({
    time,value:+d.volume[i],color:+d.close[i]>=+d.open[i]?ct.up:ct.down
  })).filter(x=>Number.isFinite(x.value)));

  CHART_SERIES={candle,ema11,ema21,sma50,volume};
  bindChartTooltip(chart,d,candle,ema11,ema21,sma50,volume);

  // Setup marker on the latest relevant day.
  try{
    const markerSeries=candle;
    const markers=[];
    if(row?.setup || S.tab==="ep" || S.tab==="breakout_htf" || S.tab==="pullback"){
      markers.push({time:d.dates[last],position:"belowBar",color:ct.up,shape:"arrowUp",text:row?.setup||SCANS[S.tab].t});
    }
    if(markers.length) markerSeries.setMarkers(markers);
  }catch(_){}



  const resize=()=>{if(LW)LW.applyOptions({width:host.clientWidth,height:host.clientHeight});};
  const ro=new ResizeObserver(()=>{resize();});ro.observe(host);
  // Default view: latest 120 trading days, with 12-candle right breathing room.
  // Vertical chart margins are controlled by the price scale: 18% top / 12% bottom.
  chart.applyOptions({rightPriceScale:{scaleMargins:{top:.18,bottom:.12}}});
  chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-120),to:n+12});
  requestAnimationFrame(resize);
}

function wire(){
  const openTradingView=(r)=>{
    if(!r || !r.symbol) return;
    const exchange=r.exch==="BSE"?"BSE":"NSE";
    const tvSymbol=exchange+":"+String(r.symbol);
    const url="https://www.tradingview.com/chart/?symbol="+encodeURIComponent(tvSymbol);
    window.open(url,"_blank","noopener,noreferrer");
  };
  document.addEventListener("click",e=>{
    const tfBtn=e.target.closest("[data-chart-tf]");
    if(tfBtn){ CHART_TF=tfBtn.dataset.chartTf==="W"?"W":"D"; if(CHART_ROW) openChart(CHART_ROW.key,CHART_ROW); return; }
    const chartBtn=e.target.closest("[data-chart-key]");
    const watchSort=e.target.closest("[data-watch-sort]");
    if(watchSort){ const key=watchSort.dataset.watchSort; if(CHART_WATCH_SORT===key) CHART_WATCH_SORT_DIR*=-1; else { CHART_WATCH_SORT=key; CHART_WATCH_SORT_DIR=(key==="symbol"?1:-1); } renderChartWatchlist(CHART_ROW?chartRowKey(CHART_ROW):""); return; }
    const watchBtn=e.target.closest("[data-watch-key]");
    const tagBtn=e.target.closest("[data-tag-key]");
    if(tagBtn){ e.stopPropagation(); return; }
    if(watchBtn){
      const key=watchBtn.dataset.watchKey;
      const r=chartRows().find(x=>chartRowKey(x)===key);
      clearTimeout(chartClickTimer);
      chartClickTimer=setTimeout(()=>openChart(key,r),220);
      return;
    }
    if(chartBtn){
      const r=Object.values(D.scans||{}).flat().find(x=>x.key===chartBtn.dataset.chartKey);
      clearTimeout(chartClickTimer);
      chartClickTimer=setTimeout(()=>openChart(chartBtn.dataset.chartKey,r),220);
      return;
    }
    const t=e.target.closest("[data-tab]"), x=e.target.closest("[data-ex]"), s=e.target.closest("[data-sort]"), l=e.target.closest("[data-lv]");
    if(t){S.tab=t.dataset.tab;S.st="";[S.key,S.dir]=SCANS[S.tab].sort;render();return}
    if(x){S.ex=x.dataset.ex;render();return}
    if(l){S.lv[l.dataset.lv]=!S.lv[l.dataset.lv];render();return}
    if(s){const k=s.dataset.sort;S.dir=S.key===k?-S.dir:1;S.key=k;render();return}
    if(e.target.id==="copyAll"){
      const all=[];
      Object.keys(SCANS).forEach(tab=>sourceRows(tab).forEach(r=>{if(r.symbol) all.push(r.symbol)}));
      const sy=[...new Set(all)];
      navigator.clipboard?.writeText(sy.join("\n")).then(()=>{
        const b=e.target, old=b.textContent; b.textContent="Copied "+sy.length+" Stocks"; setTimeout(()=>b.textContent=old,1400);
      }).catch(()=>{});
      return;
    }
    if(e.target.id==="theme"){
      const root=document.documentElement, current=root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      root.dataset.theme=current==="dark"?"light":"dark";
      try{localStorage.setItem("scn-theme",root.dataset.theme)}catch(_){}
      if(LW && CHART_ROW && CHART[CHART_ROW.key]) openChart(CHART_ROW.key,CHART_ROW);
      return;
    }
  });
  document.addEventListener("dblclick",e=>{
    const chartBtn=e.target.closest("[data-chart-key]");
    const watchBtn=e.target.closest("[data-watch-key]");
    if(!D) return;
    e.preventDefault();
    clearTimeout(chartClickTimer);
    if(chartBtn){
      const r=Object.values(D.scans||{}).flat().find(x=>x.key===chartBtn.dataset.chartKey);
      openTradingView(r);
      return;
    }
    if(watchBtn){
      const r=chartRows().find(x=>chartRowKey(x)===watchBtn.dataset.watchKey);
      openTradingView(r);
    }
  });
  document.addEventListener("change",e=>{
    const id=e.target.id;
    if(id==="rs")S.rs=Number(e.target.value);
    else if(id==="off")S.off=e.target.value;
    else if(id==="risk")S.risk=e.target.value;
    else if(id==="st")S.st=e.target.value;
    else if(id==="fmt")S.fmt=e.target.value;
    else return;
    render();
  });
  $("q").addEventListener("input",e=>{S.q=e.target.value;render()});
  document.addEventListener("keydown",e=>{if(e.key==="/" && document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus()}});
}

function openTagPalette(key,x,y){

  const palette=document.createElement("div");

  palette.dataset.tagKey=key;
  const colors=[
    ["","No colour"],["red","Red"],["orange","Orange"],["yellow","Yellow"],
    ["green","Green"],["blue","Blue"],["purple","Purple"]
  ];
  palette.innerHTML=colors.map(([color,label])=>'<button type="button" class="chart-tag-choice '+(color||"none")+'" data-palette-color="'+color+'" aria-label="'+label+'" title="'+label+'"></button>').join("");
  document.body.appendChild(palette);
  const pad=8, w=palette.offsetWidth, h=palette.offsetHeight;
  palette.style.left=Math.min(x,window.innerWidth-w-pad)+"px";
  palette.style.top=Math.min(y,window.innerHeight-h-pad)+"px";
  palette.addEventListener("click",e=>{
    const b=e.target.closest("[data-palette-color]"); if(!b) return;
    const tags=getTags(), color=b.dataset.paletteColor;
    if(color) tags[key]=color; else delete tags[key];
    saveTags(tags); CHART_WATCH_TAGS=tags; closeTagPalette(); renderChartWatchlist(CHART_ROW?chartRowKey(CHART_ROW):key);
  });

  const item=e.target.closest("[data-watch-key]");

document.addEventListener("click",e=>{

document.addEventListener("keydown",e=>{
  if(!$("chartModal").classList.contains("open")) return;
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName) && e.key!=="Escape") return;
  if(e.key==="Escape"){
    const p=document.querySelector(".chart-tag-palette");
    if(p){e.preventDefault();closeTagPalette();return;}
    e.preventDefault();closeChart();return;
  }
  // Navigate in exactly the same order as the visible watchlist.
  // This keeps keyboard arrows aligned with the current search and sort.
  const items=chartWatchItems();
  const active=CHART_ROW?.key;
  let idx=items.findIndex(x=>chartRowKey(x)===active);
  if(!items.length) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==="c"){
    if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)) return;
    const current=CHART_ROW;
    if(!current?.symbol) return;
    e.preventDefault();
    navigator.clipboard?.writeText(String(current.symbol)).then(()=>{
      const meta=$("chartMeta");
      if(!meta) return;
      const old=meta.textContent;
      meta.textContent=String(current.symbol)+" · copied";
      setTimeout(()=>{if($("chartMeta")?.textContent===String(current.symbol)+" · copied") $("chartMeta").textContent=old;},900);
    }).catch(()=>{});
    return;
  }
  if(e.key==="ArrowDown" || e.key==="ArrowRight"){
    e.preventDefault();
    clearTimeout(chartClickTimer);
    if(idx < items.length-1){
      idx++;
      const r=items[idx]; openChart(chartRowKey(r),r);
    }
    return;
  }
  if(e.key==="ArrowUp" || e.key==="ArrowLeft"){
    e.preventDefault();
    clearTimeout(chartClickTimer);
    if(idx > 0){
      idx--;
      const r=items[idx]; openChart(chartRowKey(r),r);
    }
    return;
  }
  if(e.key==="Home"){e.preventDefault(); const r=items[0]; openChart(chartRowKey(r),r);return;}
  if(e.key==="End"){e.preventDefault(); const r=items[items.length-1]; openChart(chartRowKey(r),r);return;}
  if(e.key==="1"){e.preventDefault();setChartWindow(120);return;}
  if(e.key==="2"){e.preventDefault();setChartWindow(60);return;}
  if(e.key==="3"){e.preventDefault();setChartWindow(30);return;}
  if(e.key.toLowerCase()==="f"){e.preventDefault();try{LW?.timeScale().fitContent();}catch(_){}}
});

async function load(){
  try{
    const resp=await fetch("data/results.json?"+Date.now(),{cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    D=await resp.json();
    try { const cr=await fetch("data/chart_data.json?"+Date.now(),{cache:"no-store"}); CHART=cr.ok?await cr.json():{}; } catch (_) { CHART={}; }
    const lastRefresh=D.generated?new Date(D.generated):null;
    const now=new Date();
    const nextRefresh=new Date(now);
    nextRefresh.setHours(18,0,0,0);
    if(nextRefresh<=now) nextRefresh.setDate(nextRefresh.getDate()+1);
    const fmtIST=d=>d.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});
    $("meta").textContent=`${D.asof||"—"} · ${Number(D.stats?.traded_last_day||0).toLocaleString("en-IN")} stocks traded · Last refresh: ${lastRefresh?fmtIST(lastRefresh):"—"} IST · Next refresh: ${fmtIST(nextRefresh)} IST`;
    const age=(Date.now()-new Date(D.asof))/864e5;
    if(Number.isFinite(age)&&age>4){$("stale").style.display="block";$("stale").textContent=`Data is ${Math.floor(age)} days old.`;}
    render();
    document.body.classList.add("ready");
  }catch(err){
    console.error(err);
    $("meta").textContent="Could not load data/results.json";
    $("foot").textContent="Make sure the local server is running from ~/stock-screener.";
    document.body.classList.add("ready");
  }
}

try{
  const th=localStorage.getItem("scn-theme");
  if(th) document.documentElement.dataset.theme=th;
}catch(_){}
wire();
load();
</script>
