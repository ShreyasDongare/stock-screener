name: Daily Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"  # 6:00 PM IST, every day (handles Sunday Muhurat Trading)

concurrency:
  group: daily-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: market-data-raw-${{ github.run_id }}
          restore-keys: |
            market-data-raw-

      - name: Download missing market data
        run: |
          python fetch_bhav.py --days 420

      - name: Build price data
        run: |
          python build_prices.py

      - name: Run stock scans
        run: |
          python run_scans.py

      - name: Build full chart history
        run: |
          python build_chart_history.py

      - name: Publish scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/results.json data/chart_data.json
          git diff --cached --quiet || git commit -m "Update daily scanner results"
          git push