name: Daily Stock Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download 420 days of market data
        run: |
          python fetch_bhav.py --days 420

      - name: Build price data
        run: |
          python build_prices.py

      - name: Run stock scans
        run: |
          python run_scans.py

      - name: Publish scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/results.json
          git diff --cached --quiet || git commit -m "Update daily scanner results"
          git push
